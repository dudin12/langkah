    case 'trashcancel': ui.trashConfirm=false; break;
    case 'trashempty': purge(null); save(); ui.trashConfirm=false; toast('Sampah dikosongkan.'); break;
    case 'carry':
      var cl=d.id?[byId(d.id)].filter(Boolean):staleToday();
      cl.forEach(function(x){ if(d.to==='later')setStatus(x,'later'); else {x.todayAt=now();touch(x);} });
      save(); toast(d.to==='later'?'Dipindah ke Nanti.':'Tetap di Hari Ini.'); break;
    case 'syconnect': syConnect(); return;
    case 'sydisc': syDisconnect(); return;
    case 'synow': syncNow('manual').then(function(r){ if(r===true)toast('Tersinkron.'); }); return;
    case 'fsconnect': fsConnect(); return;
    case 'fsresume': fsResume(); return;

        toast(rt==='later'?'Dibuka lagi, kembali ke Nanti.':'Dibuka lagi di Hari Ini.');
      }else{

    case 'sharebk': shareBackup(); return;
    case 'bksnooze': PREF.bkSnooze=now(); savePref(); break;
    case 'rateclose': PREF.rateAsked=true; savePref(); break;
    case 'fbstar': fbKeep(); if(ui.fb)ui.fb.nilai=(ui.fb.nilai===+d.key?0:+d.key); break;
    case 'fbtype': fbKeep(); if(ui.fb)ui.fb.jenis=d.key; break;

    case 'fbagain': ui.fb=null; break;
    case 'fbflush': if(navigator.onLine===false){toast('Masih offline. Akan dikirim otomatis saat tersambung.');break;} fbFlush(); break;
    case 'fbdrop': fbSaveQ([]); toast('Masukan yang tertunda dibatalkan.'); break;

    case 'syauto': PREF.syManual=!PREF.syManual; savePref(); if(PREF.syManual){clearTimeout(SY.timer);SY.timer=null;}else if(syDirty())syQueue(); break;

  }

}

    if(!(mm>=1&&mm<=720)){toast('Isi menit antara 1 sampai 720.');render();return;}

  }
  if(kind==='quickcap'){quickSave();return;}
  if(kind==='capture2'){tuangAdd(!!forceNote);return;}
  if(kind==='projcreate'){projCreate();return;}
  if(kind==='grpadd'){
    if(!v)return; var gp=(d.id&&d.id!=='none')?d.id:null, gt=addTask(v,(ui.filter==='today'?'today':'later'),gp); save(); ui.refocus='ga-'+(gp||'none'); toast(ui.filter==='today'?'Masuk Hari Ini.':'Disimpan di Nanti.'); render(); return;
  }
  if(kind==='capture'){
    if(!v)return;
    var asNote=!!forceNote||ui.view==='focus'||ui.capType==='note';
    var pid=null;
    if(ui.view==='focus'){var cf4=F(), ft=cf4&&byId(cf4.id); pid=ft?ft.projectId:null;}
    else{var se=document.getElementById('capproj'); pid=se?(se.value||null):(ui.capProject||null);}
    if(asNote){addNote(v,pid);toast('Masuk Catatan.');}else{addTask(v,'inbox',pid);toast('Tertangkap.');}
    save();inp.value='';if(ui.view!=='focus')ui.capDraft='';
    ui.refocus=(ui.view==='focus')?'terlintas':'capture';
    render(); return;
  }
  if(kind==='stepadd'){
    var t=byId(d.id); if(!t||!v)return;
    t.steps.push({id:uid(),text:v,done:false,doneAt:null}); touch(t);
    var r=syncStatus(t); save();
    ui.exp[(ui.view==='focus'?'f:':'')+t.id]=true; ui.refocus='si-'+t.id;
    if(r==='reopened')toast('Tugas dibuka lagi.');
    render(); return;
  }
  if(kind==='ntaskgo'){createNoteTask('later');return;}
  if(kind==='syconnect'){syConnect();return;}
  if(kind==='notetitle'){var ta=document.getElementById('editn');if(ta)ta.focus();return;}
  if(kind==='savetask'){saveTask(d.id);return;}
  if(kind==='savestep'){saveStep(d.id,d.sid);return;}
  if(kind==='saveent'){saveEntity();return;}
  if(kind==='addarea'){
    if(!v)return; S.areas.push({id:uid(),name:v,archived:false}); save(); ui.refocus='newarea'; toast('Kerjaan ditambahkan.'); render(); return;

  }
  if(kind==='projtask'){
    if(!v)return; addTask(v,'later',d.id); save(); ui.refocus='pt-'+d.id; toast('Tugas ditambahkan.'); render(); return;
  }
}

/* ---------- Tanggal: jadwal dan tenggat ----------
   Jadwal  = "muncul lagi di Hari Ini pada tanggal ini" (tugas menunggu di Nanti, tidak mengganggu).
   Tenggat = batas akhir, hanya penanda. Keduanya opsional dan tanpa pengingat. */
function ymd(d){d=d||new Date();var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
function validYmd(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);}
function parseYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function dayDiff(s){var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((parseYmd(s)-t)/864e5);}
function fmtYmd(s,long){return parseYmd(s).toLocaleDateString('id-ID',long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'});}
function dateSnap(t){return {status:t.status,sched:t.sched,due:t.due,todayAt:t.todayAt};}
function dateUndo(id,p){
  var t=byId(id); if(!t)return;
  t.status=p.status; t.todayAt=p.todayAt;
  if(p.sched)t.sched=p.sched; else delete t.sched;
  if(p.due)t.due=p.due; else delete t.due;
  touch(t);
}
function applyDate(id,key,v){
  var t=byId(id); if(!t||t.status==='trash')return;
  var prev=dateSnap(t), ok=validYmd(v);
  function undo(){dateUndo(id,prev);}
  if(key==='due'){
    if(ok)t.due=v; else delete t.due;
    touch(t); save();
    toast(t.due?'Tenggat dicatat: '+fmtYmd(t.due,true)+'.':'Tenggat dihapus.',undo); return;
  }
  if(!ok){delete t.sched;touch(t);save();toast('Jadwal dihapus.',undo);return;}
  if(t.status==='done'){t.sched=v;touch(t);save();return;}
  if(v<=ymd()){
    if(t.status!=='today')setStatus(t,'today');
    delete t.sched; touch(t); save(); toast('Masuk Hari Ini.',undo); return;
  }
  t.sched=v; if(t.status!=='later')setStatus(t,'later');
  touch(t); save(); toast('Dijadwalkan '+fmtYmd(v,true)+'. Muncul lagi di Hari Ini hari itu.',undo);
}
function unsched(id){
  var t=byId(id); if(!t)return; var prev=dateSnap(t);
  delete t.sched; if(t.status==='today')setStatus(t,'later');
  touch(t); save(); toast('Kembali ke Belum dijadwalkan.',function(){dateUndo(id,prev);});
}
function dueInfo(t){
  if(!t.due||t.status==='done'||t.status==='trash')return null;
  var d=dayDiff(t.due);
  if(d<0)return {cls:' now',tx:'Lewat tenggat '+(-d)+' hari'};
  if(d===0)return {cls:' now',tx:'Tenggat hari ini'};
  if(d===1)return {cls:' soon',tx:'Tenggat besok'};
  if(d<=3)return {cls:' soon',tx:'Tenggat '+d+' hari lagi'};
  return {cls:'',tx:'Tenggat '+fmtYmd(t.due)+' · '+d+' hari'};
}
function dueChip(t){
  var i=dueInfo(t); if(!i)return '';
  return '<button type="button" class="dchip'+i.cls+'" data-act="togglesteps" data-key="'+esc(t.id)+'" data-def="0">'+esc(i.tx)+'</button>';
}
function schedChip(t){
  if(t.status!=='later'||!t.sched)return '';
  return '<button type="button" class="dchip" data-act="togglesteps" data-key="'+esc(t.id)+'" data-def="0">Muncul '+esc(fmtYmd(t.sched))+'</button>';

/* yang perlu dilihat pagi ini: tenggat dekat yang masih di Nanti, dan yang sudah lama diam di Nanti */
function morningItems(){
  var out=[], now0=Date.now();
  S.tasks.forEach(function(t){
    if(t.status!=='later')return;
    if(t.due&&dayDiff(t.due)<=3){var i=dueInfo(t); out.push({t:t,why:i?i.tx:'',k:0,s:t.due});return;}
    if(!t.due&&!t.sched&&t.updatedAt){
      var days=Math.floor((now0-new Date(t.updatedAt).getTime())/864e5);
      if(days>=14)out.push({t:t,why:'Sudah '+days+' hari di Nanti',stale:true,k:1,s:t.updatedAt});
    }
  });
  out.sort(function(a,b){return a.k!==b.k?a.k-b.k:(a.s<b.s?-1:1);});
  return out.slice(0,5);
}
function morningBox(){
  if(PREF.pagiOff===ymd())return '';

    '<span class="small">Cukup beberapa menit. Pilih yang mau dikerjakan, jadwalkan ke hari lain, atau buang yang sudah tidak perlu.</span></div>';
  h+=it.map(function(x){
    var t=x.t, id=esc(t.id);
    return '<div class="crow"><div class="ct">'+esc(t.title)+'<span class="small" style="display:block">'+esc(x.why)+'</span></div>'+
      '<div class="btns"><button class="btn-o" type="button" data-act="totoday" data-id="'+id+'">Hari ini</button>'+dateBtn(t,'sched','Jadwalkan')+
      (x.stale?'<button class="btn-o" type="button" data-act="triage" data-to="trash" data-id="'+id+'">Buang</button>':'')+'</div></div>';
  }).join('');
  return h+'<div class="btns"><button class="btn-o" type="button" data-act="pagiclose">Nanti saja</button></div></section>';
}

function viewWeek(){
  var off=ui.weekOff||0, t0=ymd(), start=addDays(t0,off*7), cols='';
  function byDue(a,b){var x=a.due||'9999',y=b.due||'9999';return x!==y?(x<y?-1:1):byCreated(a,b);}
  var pool=S.tasks.filter(function(t){return (t.status==='later'||t.status==='inbox')&&!t.sched;}).sort(byDue);
  for(var i=0;i<7;i++){
    var dt=addDays(start,i), isT=(dt===t0);
    var ts=S.tasks.filter(function(t){return isT?t.status==='today':(t.status==='later'&&t.sched===dt);}).sort(byDue);
    var dues=S.tasks.filter(function(t){return t.due===dt&&t.status!=='done'&&t.status!=='trash';});
    cols+='<section class="wday'+(isT?' today':'')+'" data-date="'+dt+'" aria-label="'+esc(fmtYmd(dt,true))+'">'+
      '<h3><span>'+(isT?'Hari ini':esc(fmtYmd(dt)))+'</span><span class="small" title="'+ts.length+' tugas">'+(ts.length||'')+'</span></h3>'+
      (ts.length>=6?'<span class="dchip soon">Agak padat</span>':'')+
      ts.map(wkCard).join('')+
      dues.map(function(t){return '<div class="wdue">Tenggat · '+esc(t.title)+'</div>';}).join('')+
      (!ts.length&&!dues.length?'<div class="small wempty">Kosong</div>':'')+'</section>';
  }
  var h='<div class="wrap wk"><header><h1>Minggu</h1><p class="sub">Lihat beban tiap hari, lalu atur kapan tugas muncul di Hari Ini. Di komputer, seret tugas ke hari yang pas. Di HP, ketuk tugas untuk memilih tanggal.</p></header>'+
    '<div class="btns" style="align-items:center"><button class="btn-o" type="button" data-act="weekgo" data-key="-1"'+(off<=0?' disabled':'')+'>← Sebelumnya</button>'+

/* ---------- Daftar di catatan (teks biasa, tanpa format tersembunyi) ---------- */
function parseLi(line){
  var m=/^(\s*)([-*•]|\d{1,3}[.)])(\s+)(\[[ xX]\](?:\s+|$))?/.exec(line);
  if(!m)return null;
  var num=/^\d/.test(m[2]);
  return {indent:m[1].length,mark:m[2],num:num,ck:(!num&&m[4])?(/[xX]/.test(m[4])?'x':' '):null,len:m[0].length,rest:line.slice(m[0].length)};
}
function taInsert(ta,text,from,to){
  if(from!=null)ta.setSelectionRange(from,to);
  var ok=false;
  try{ok=(text==='')?document.execCommand('delete'):document.execCommand('insertText',false,text);}catch(e){}
  if(!ok){ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input',{bubbles:true}));}
}
function lineBlock(ta){
  var v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;
  var ls=s>0?v.lastIndexOf('\n',s-1)+1:0, ee=(e>s&&v.charAt(e-1)==='\n')?e-1:e, le=v.indexOf('\n',ee); if(le<0)le=v.length;
  return {ls:ls,le:le};
}
/* Enter di baris daftar: lanjutkan daftar. Baris daftar yang kosong: akhiri (atau geser keluar satu tingkat) */
function listEnter(ta){
  var v=ta.value,s=ta.selectionStart,e=ta.selectionEnd; if(s!==e)return false;
  var ls=s>0?v.lastIndexOf('\n',s-1)+1:0, le=v.indexOf('\n',s); if(le<0)le=v.length;
  var line=v.slice(ls,le), li=parseLi(line); if(!li||s-ls<li.len)return false;
  if(!li.rest.trim()&&s===le){taInsert(ta,li.indent>=2?line.slice(2):'',ls,le);return true;}
  var mk=li.num?(parseInt(li.mark,10)+1)+li.mark.slice(-1):(li.mark+(li.ck!==null?' [ ]':''));
  taInsert(ta,'\n'+line.slice(0,li.indent)+mk+' ',s,s); return true;
}
function listShift(ta,dir){
  var b=lineBlock(ta), v=ta.value, s0=ta.selectionStart, e0=ta.selectionEnd, lines=v.slice(b.ls,b.le).split('\n'), ch=false, first=0;
  var any=lines.some(function(l){return !!parseLi(l);}); if(!any)return false;
  var out=lines.map(function(l,i){
    var li=parseLi(l); if(!li)return l;
    var ni=Math.max(0,Math.min(8,li.indent+dir*2)); if(ni===li.indent)return l;
    ch=true; var nl=new Array(ni+1).join(' ')+l.slice(li.indent); if(i===0)first=nl.length-l.length; return nl;
  });
  if(!ch)return dir>0;
  var txt=out.join('\n'); taInsert(ta,txt,b.ls,b.le);
  if(s0===e0){var p=Math.max(b.ls,s0+first);ta.setSelectionRange(p,p);}else ta.setSelectionRange(b.ls,b.ls+txt.length);
  return true;
}
/* tombol bantu (untuk HP): poin, nomor, centang, geser */
function listFormat(ta,kind){
  ta.focus();
  if(kind==='in'||kind==='out'){listShift(ta,kind==='in'?1:-1);return;}
  var b=lineBlock(ta), v=ta.value, lines=v.slice(b.ls,b.le).split('\n'), single=lines.length===1, infos=lines.map(parseLi);
  function isKind(li){return !!li&&(kind==='b'?(!li.num&&li.ck===null):(kind==='n'?li.num:(!li.num&&li.ck!==null)));}
  var any=false, all=true;
  lines.forEach(function(l,i){if(!single&&!l.trim())return; any=true; if(!isKind(infos[i]))all=false;});
  all=all&&any; var n=0;
  var out=lines.map(function(l,i){
    if(!single&&!l.trim())return l;
    var li=infos[i], ind=li?l.slice(0,li.indent):/^\s*/.exec(l)[0], rest=li?li.rest:l.slice(ind.length);
    if(all)return ind+rest;
    n++; return ind+(kind==='b'?'- ':(kind==='c'?'- [ ] ':n+'. '))+rest;
  });
  var txt=out.join('\n'); taInsert(ta,txt,b.ls,b.le);
  var pos=b.ls+txt.length; if(single)ta.setSelectionRange(pos,pos); else ta.setSelectionRange(b.ls,pos);
}
function listTool(id){
  return '<div class="ltool" role="group" aria-label="Format daftar">'+[['b','Poin','Poin'],['n','1.','Nomor'],['c','☐ Centang','Centang'],['out','←','Geser ke kiri'],['in','→','Geser ke kanan']].map(function(x){

function noteLines(n){

  if(!(n.title&&n.title.trim())){var i=0;while(i<all.length&&!all[i].trim())i++;st=i+1;}
  while(st<all.length&&!all[st].trim())st++;

  return {st:st,lines:all.slice(st,en)};
}
/* isi catatan -> HTML aman (semua teks di-escape, hanya daftar yang diberi bentuk) */
function renderNoteBody(n){

    }
    if(li.num)return '<div class="nl li nm" data-n="'+esc(li.mark)+'"'+st+'>'+esc(li.rest)+'</div>';

function hubGroups(mode){
  var td=new Date().toDateString(), map={}, order=[];
  S.tasks.forEach(function(t){
    var ok=(mode==='today')?(t.status==='today'||(t.status==='done'&&t.doneAt&&dayOf(t.doneAt)===td)):(t.status==='today'||t.status==='later');
    if(!ok)return;
    var p=t.projectId?projById(t.projectId):null; if(p&&!projActive(p))p=null;
    if(mode==='none'&&p)return;
    var k=p?p.id:'none'; if(!map[k]){map[k]={key:k,p:p,tasks:[]};order.push(k);} map[k].tasks.push(t);
  });
  var tree={}; projTreeList().forEach(function(p,i){tree[p.id]=i;});
  var gs=order.map(function(k){
    var g=map[k];
    g.tasks.sort(function(a,b){var da=a.status==='done',db=b.status==='done'; if(da!==db)return da?1:-1; return byDueThenCreated(a,b);});
    g.due=null; g.tasks.forEach(function(t){if(t.status!=='done'&&t.due&&(!g.due||t.due<g.due))g.due=t.due;});
    return g;
  });
  function rank(g){return g.key==='none'?1:(g.due?0:2);}
  gs.sort(function(a,b){
    var ra=rank(a), rb=rank(b); if(ra!==rb)return ra-rb;
    if(ra===0)return a.due<b.due?-1:(a.due>b.due?1:0);
    if(ra===2)return (tree[a.key]||0)-(tree[b.key]||0);
    return 0;
  });
  return gs;
}

  if(e.inputType!=='insertLineBreak'&&e.inputType!=='insertParagraph')return;
  if(el.hasAttribute('data-enter')){if(el.getAttribute('data-enter')==='capture2'&&LASTSHIFT)return;e.preventDefault();triggerEnter(el);return;}
  if(el.hasAttribute('data-list')&&listEnter(el))e.preventDefault();
});
/* tombol bantu daftar tidak boleh mencuri fokus dari kolom tulis (supaya keyboard HP tetap terbuka) */
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.ltool'))e.preventDefault();});
document.addEventListener('keydown',function(e){
  LASTSHIFT=!!e.shiftKey;
  if(e.key==='Tab'&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.target&&e.target.tagName==='TEXTAREA'&&e.target.hasAttribute('data-list')){
    if(listShift(e.target,e.shiftKey?-1:1)){e.preventDefault();return;}
  }
  if(e.key==='Escape'&&ui.modal){modalClose();render();return;}
  if(e.key==='Escape'&&ui.quickOpen){ui.quickOpen=false;render();return;}
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!isField(e.target)){e.preventDefault();quickCapture();return;}
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){e.preventDefault();ui.view='search';ui.edit=null;ui.refocus='gsearch';render();return;}
  if(e.key==='Escape'&&(ui.edit||ui.ntask)){ui.edit=null;ui.ntask=null;render();return;}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target&&e.target.getAttribute){
    var c=e.target.getAttribute('data-ctrl'), en=e.target.getAttribute('data-enter');
    if(c==='note-new'){e.preventDefault();saveNewNote();return;}
    if(c==='note-cap'){e.preventDefault();captureNote();return;}
    if(c==='note-quick'){e.preventDefault();quickSave();return;}
    if(c==='note-modal'){e.preventDefault();modalClose();render();return;}
    if(en==='capture2'){e.preventDefault();onEnter('capture2',e.target,{},true);return;}
    if(c==='savenote'){e.preventDefault();saveNote(e.target.getAttribute('data-id'));return;}
    if(en==='capture'){e.preventDefault();onEnter('capture',e.target,{},true);return;}
  }
  if(e.key!=='Enter'||e.isComposing)return;
  var el=e.target; if(!el||!el.getAttribute)return;
  if(!el.getAttribute('data-enter'))return;
  if(e.shiftKey&&el.getAttribute('data-enter')==='capture2')return;
  e.preventDefault(); triggerEnter(el);
});
function triggerEnter(el){
  var kind=el&&el.getAttribute&&el.getAttribute('data-enter'); if(!kind)return;
  onEnter(kind,el,{id:el.getAttribute('data-id'),sid:el.getAttribute('data-sid')});
}
/* tombol Enter/Go di keyboard HP: dikirim browser sebagai submit form, bukan keydown biasa */
document.addEventListener('submit',function(e){
  e.preventDefault();
  var el=document.activeElement; if(el&&el.getAttribute&&el.getAttribute('data-enter'))triggerEnter(el);
});
document.getElementById('importfile').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f){FS.holdUntil=0;return;}
  var r=new FileReader();
  r.onload=function(){
    FS.holdUntil=0;
    try{
      var j=JSON.parse(r.result);
      if(!j||!Array.isArray(j.tasks))throw new Error('format');
      restoreFrom(j,'File '+f.name,'file'); render();
    }catch(err){toast('File itu bukan cadangan Langkah.');render();}
  };
  r.readAsText(f);ev.target.value='';
});

/* ganti tampilan saat lebar layar melewati batas */
var lastMode=W()+'|'+canWide(), rzTimer=null;
window.addEventListener('resize',function(){
  clearTimeout(rzTimer);
  rzTimer=setTimeout(function(){var m=W()+'|'+canWide();if(m!==lastMode){lastMode=m;render();}else growAll();},150);
});
/* jam fokus: hanya perbarui angka */
setInterval(function(){
  ringTick();
  var L=sessList(); if(!L.length)return;
  var cur=F(), anyOver=false, rerender=false;
  L.forEach(function(x){
    var ci=clockInfo(x), bc=document.getElementById('fbclock-'+x.id);
    if(bc)bc.textContent=ci.text;
    if(cur&&cur.id===x.id&&ui.view==='focus'){
      var c=document.getElementById('clock'),l=document.getElementById('clocklbl'),r=document.getElementById('ringp');
      if(c)c.textContent=ci.text; if(l)l.textContent=ci.label;
      if(r){var circ=2*Math.PI*104;r.setAttribute('stroke-dasharray',(ci.frac*circ).toFixed(1)+' '+circ.toFixed(1));}
    }
    if(ci.over){
      anyOver=true;
      if(!isAlerted(x)){
        setAlerted(x); var over=Math.floor((Date.now()-x.start)/1000)-x.timerMin*60;
        notifyOver(byId(x.id),x); if(over<=120)ringStart(x.id); rerender=true;
      }
    }
  });
  if(anyOver)document.title='\u23f0 Waktu habis \u00b7 Langkah';
  if(rerender){if(ui.view==='focus')render(); else paintBar();}
},1000);

/* sinkron antar-tab: tab lain menyimpan, tab ini ikut memuat ulang */
window.addEventListener('storage',function(e){
  if(e.key!==KEY&&e.key!==PREFKEY&&e.key!==null)return;
  if(e.key===PREFKEY||e.key===null){try{PREF=JSON.parse(localStorage.getItem(PREFKEY))||{};}catch(x){}}
  if(e.key===KEY||e.key===null){S=load();}
  if(ui.view==='focus'&&!F())ui.view='today';
  if(e.key===KEY||e.key===null)snapHashes();
  softRender();
});
/* ganti hari saat aplikasi masih terbuka */
var curDay=new Date().toDateString();
function dayCheck(){
  var dd=new Date().toDateString(); if(dd===curDay)return;
  curDay=dd; autoSweep();
  var ae=document.activeElement; if(!ui.edit&&!(isField(ae)&&ae.value))render();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)dayCheck();});
window.addEventListener('focus',dayCheck);
setInterval(dayCheck,60000);

/* ---------- Mulai ---------- */
if(purge(new Date(Date.now()-30*864e5).toISOString()))MIG=true;
if(MIG)save();
autoSweep();
fsInit();
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){syncNow('focus');return;}
  if(SY.timer){clearTimeout(SY.timer);SY.timer=null;syncNow('change');}
});
window.addEventListener('focus',function(){syncNow('focus');fsLoad();fbFlush();if(ui.view==='notif')render();});
document.addEventListener('visibilitychange',function(){if(!document.hidden)fsLoad();});
setInterval(function(){if(!document.hidden)fsLoad();},30000);
window.addEventListener('online',function(){syncNow('online');fbFlush();});
setInterval(function(){
  if(document.hidden||!SY.cfg)return; var m=syEvery(); if(!m)return;
  var last=Math.max(SY.lastTs||0,SY.lastTry||0); if(Date.now()-last>=m*60000)syncNow('timer');
},15000);
if(PREF.noteSort==='new'||PREF.noteSort==='old'||PREF.noteSort==='upd')ui.noteSort=PREF.noteSort;
if(!PREF.firstUse){PREF.firstUse=now();savePref();}
restoreView();
render();
tryPersist();
setTimeout(fbFlush,1500);
(function(){
  try{
    var q=new URLSearchParams(location.search), a=q.get('aksi'), id=q.get('id');
    if(a&&id){history.replaceState(null,'',location.pathname);sessAction(a,id);}
  }catch(e){}
})();
syncNow('start');
})();
</script>
