<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langkah</title>
<meta name="theme-color" content="#2B6B61">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --line:#E4E0D6; --text:#23211E; --muted:#5C574E;
  --accent:#2B6B61; --accent-d:#1F4F47; --tint:#DDEBE6; --side:#EDEAE2; --ctl:#857E70;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;min-height:100vh}
.side{flex:0 0 240px;background:var(--side);padding:28px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:600;font-size:20px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:#4A453D;font-size:15px;text-align:left}
.nav button[aria-current="page"]{background:#fff;color:var(--accent-d);font-weight:600}
.nav .count{margin-left:auto;font-size:13px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.side-foot button{min-height:40px;border-radius:10px;border:1.5px solid #B9B2A3;background:transparent;font-size:13px;color:#3A362F}
.main{flex:1 1 560px;min-width:0;padding:48px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.date{font-size:14px;color:var(--muted)}
h1{font-size:38px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:8px 0 0;font-size:16px;line-height:1.5;color:var(--muted)}
.field label{display:block;font-size:14px;font-weight:600;color:#3A362F;margin-bottom:8px}
.input{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 10px 0 18px;background:#fff;border:1.5px solid var(--ctl);border-radius:16px}
.input input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px}
.input textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;line-height:1.45;resize:none;overflow:hidden;padding:16px 0;color:inherit}
.input.big{align-items:flex-end;padding:8px 10px 10px 14px}.input.big>svg{display:none}
.input:focus-within{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.psel{height:40px;max-width:190px;border:1.5px solid #B9B2A3;border-radius:10px;background:#fff;padding:0 8px;font-size:14px;color:#3A362F}
.psel.wide{max-width:none;width:100%;height:44px}
.hint{font-size:13px;color:var(--muted);white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.triage{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-radius:16px}
.triage .t{flex:1 1 240px;display:flex;flex-direction:column;gap:2px}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--accent-d)}
.btn-o{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ctl);background:#fff;color:#3A362F;font-size:14px;font-weight:500}
.btn-o.on{background:var(--tint);border-color:var(--accent);color:var(--accent-d);font-weight:600}
.btn-g{border:1.5px solid var(--accent);color:var(--accent-d);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 24px;background:var(--tint);border-radius:18px}
.suggest .t{flex:1 1 260px}
.suggest b{display:block;font-size:17px;line-height:1.35;color:#14312C}
.suggest span{font-size:13px;font-weight:600;color:var(--accent-d)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sec-head h2{font-size:20px}
.segs{display:flex;gap:4px;align-items:center}
.segs i{width:28px;height:8px;border-radius:4px;background:#D9D4C7;display:block}
.segs i.on{background:var(--accent)}
.list{display:flex;flex-direction:column;gap:12px}
.task{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;flex-wrap:wrap}
.task .body{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .title{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.task.done .title{font-weight:500;color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plabel{font-size:12px;color:#4A453D;background:#EDEAE2;padding:3px 10px;border-radius:999px}
.chk{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ctl);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{display:none}.chk.on svg{display:block;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent-d);padding:4px 10px;background:var(--tint);border-radius:999px;border:0}
.chip svg{transition:transform .2s}
.chip[aria-expanded="true"] svg{transform:rotate(90deg)}
.ibtn{flex:0 0 44px;width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.ibtn:hover{background:rgba(0,0,0,.07)}
.editf{display:flex;flex-direction:column;gap:8px}
.rowpane{flex:0 0 100%;width:100%;padding:0 0 4px 0}
.rowpane .pane{max-width:none;border:0;background:var(--bg)}
.later-note{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1.5px dashed #B9B2A3;border-radius:18px;color:#4A453D;font-size:15px;background:transparent;width:100%;text-align:left}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed #B9B2A3;border-radius:18px;line-height:1.5}
.soft{padding:12px 16px;border-radius:14px;background:#F6E3BE;color:#5A3B00;font-size:14px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;padding:0;font-size:15px;font-weight:500;color:var(--accent)}
/* dasbor */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:34px;line-height:1.1;font-weight:600}
.stat span{font-size:14px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#E4E0D6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.area{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.ahead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ahead h2{font-size:20px;flex:1 1 160px;overflow-wrap:anywhere}
.prow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pt{flex:1 1 180px;display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;font-size:16px;font-weight:600;text-align:left;padding:0}
.pt svg{transition:transform .2s;flex:0 0 auto}
.pt[aria-expanded="true"] svg{transform:rotate(90deg)}
.pbody{display:flex;flex-direction:column;gap:10px;padding:4px 0 6px}
.addrow{display:flex;gap:8px}
.addrow .sin{flex:1}
/* panel langkah */
.pane{width:100%;max-width:520px;text-align:left;border-radius:18px;background:#fff;border:1px solid var(--line)}
.pane-toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 18px;border:0;background:transparent;font-size:15px;font-weight:600;border-radius:18px;text-align:left;color:inherit}
.pane-toggle svg{transition:transform .2s;flex:0 0 auto}
.pane-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.pane-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.rowpane .pane-body{padding-top:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;max-height:46vh;overflow:auto}
.srow{display:flex;align-items:center;gap:2px;padding:0 2px 0 0;min-height:42px;border-radius:0;background:transparent;border:0;border-bottom:1px solid var(--line)}
.steps .srow:last-child{border-bottom:0}
.rowpane .srow{background:transparent}
.srow.cur{background:var(--tint);border-radius:10px;border-color:transparent}
.srow.over{outline:2px dashed var(--accent)}
.srow.dragging{opacity:.45}
.srow .sc{flex:0 0 40px;width:40px;height:40px;border:0;background:transparent;position:relative;display:flex;align-items:center;justify-content:center;padding:0}
.srow .sc::before{content:"";position:absolute;left:9px;top:9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ctl);background:#fff;box-sizing:border-box}
.srow .sc.on::before{background:var(--accent);border-color:var(--accent)}
.srow .sc svg{display:none;position:relative;width:13px;height:13px}.srow .sc.on svg{display:block}
.srow .tx{flex:1;min-width:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere;padding:0 6px}
.srow.done .tx{color:var(--muted);text-decoration:line-through}
.srow.edit{flex-wrap:wrap;gap:8px;padding:8px}
.srow.edit .sin{flex:1 1 180px}
.sbtn{flex:0 0 34px;width:34px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0}
.sbtn:hover:not([disabled]){background:rgba(0,0,0,.07)}
.sbtn[disabled]{opacity:.25;cursor:default}
.sin{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1.5px solid var(--ctl);border-radius:12px;background:#fff}
.sin input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:15px}
.sin textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;line-height:1.4;resize:none;overflow:hidden;padding:13px 0;color:inherit}
.sin:focus-within{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
/* fokus */
.focus{min-height:100vh;background:#1E2926;color:#F2F0EA;padding:28px 40px 40px;display:flex;flex-direction:column}
.focus .back{color:#8FD1BF}
.ftop{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.fbtn{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid #5B6F68;background:transparent;color:#E4EBE8;font-size:14px;font-weight:500}
.fbtn[aria-pressed="true"]{border-color:#8FD1BF;background:#34443F;color:#fff;font-weight:600}
.fgrid{flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;padding-top:12px}
.fleft{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:16px 0 4px;width:100%}
.fright{display:flex;flex-direction:column;gap:16px;width:100%;max-width:560px;padding-bottom:24px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#8FD1BF}
.focus h1{font-size:38px;max-width:640px}
.ring{position:relative;width:240px;height:240px}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .time{font-size:56px;font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .lbl{font-size:14px;color:#B5C2BD}
.fact{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.fmain{min-width:220px;height:64px;padding:0 32px;border:0;border-radius:18px;background:#8FD1BF;color:#14211E;font-size:20px;font-weight:600}
.fsec{height:64px;padding:0 24px;border-radius:18px;border:1.5px solid #5B6F68;background:transparent;color:#E4EBE8;font-size:16px;font-weight:500}
.fpanel{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:18px;background:#2A3833}
.fpanel label{font-size:14px;font-weight:600;color:#E4EBE8}
.finput{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;background:#1E2926;border:1.5px solid #6F837C;border-radius:14px}
.finput input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px;color:#F2F0EA}
.finput textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;line-height:1.4;resize:none;overflow:hidden;padding:14px 0;color:#F2F0EA}
.finput:focus-within{outline:3px solid rgba(143,209,191,.45);outline-offset:2px}
.fpanel .hint{color:#B5C2BD}
.fnote{margin:0;max-width:460px;font-size:15px;line-height:1.5;color:#B5C2BD}
.focus .pane{background:#2A3833;border-color:#3D4F48;color:#F2F0EA;max-width:none}
.focus .srow{background:transparent;border-color:#3D4F48}
.focus .srow.cur{background:#34443F}
.focus .srow .sc::before{background:#1E2926;border-color:#6F837C}
.focus .srow .sc.on::before{background:#8FD1BF;border-color:#8FD1BF}
.focus .srow .sc svg{stroke:#14211E}
.focus .srow.done .tx{color:#B5C2BD}
.focus .sbtn{color:#B5C2BD}
.focus .sbtn:hover:not([disabled]){background:rgba(255,255,255,.1)}
.focus .sin{background:#1E2926;border-color:#6F837C}
.focus .sin input,.focus .sin textarea{color:#F2F0EA}
.focus .small{color:#B5C2BD}
.focus .btn{background:#8FD1BF;color:#14211E}
.focus .btn-o{background:transparent;color:#E4EBE8;border-color:#5B6F68}
.title-btn{display:block;text-align:left;font-size:17px;font-weight:600;background:transparent;border:0;padding:2px 4px;margin:-2px -4px;border-radius:8px;overflow-wrap:anywhere;cursor:text;color:inherit}
.title-btn:hover,.name-btn:hover,.srow button.tx:hover{background:rgba(0,0,0,.05)}
.task.done .title-btn{font-weight:500;color:var(--muted);text-decoration:line-through}
.tsel{min-height:32px;border:0;border-radius:999px;background:#EDEAE2;color:#4A453D;font-size:12px;padding:0 8px;max-width:100%;text-overflow:ellipsis;cursor:pointer}
.tsel.none{background:transparent;border:1.5px dashed #B9B2A3;color:#5C574E}
.name-btn{flex:1 1 160px;min-height:44px;border:0;background:transparent;text-align:left;font-size:16px;font-weight:600;padding:0 6px;border-radius:8px;overflow-wrap:anywhere;cursor:text;color:inherit}
h2 .name-btn{font-size:20px}
.cv svg{transition:transform .2s}
.cv[aria-expanded="true"] svg{transform:rotate(90deg)}
.srow button.tx{background:transparent;border:0;text-align:left;min-height:42px;color:inherit;cursor:text;font-size:15px;border-radius:8px}
.srow.done button.tx{color:var(--muted);text-decoration:line-through}
.focus .srow.done button.tx{color:#B5C2BD}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #B9B2A3;background:#fff;font-size:14px;color:#3A362F}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.grp{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ghead{display:flex;align-items:baseline;gap:10px;padding:8px 2px 0}
.ghead b{font-size:16px}
.caprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.caprow label{margin:0!important}
.seg{display:inline-flex;border:1.5px solid #B9B2A3;border-radius:999px;overflow:hidden;background:#fff}
.seg button{min-height:36px;padding:0 16px;border:0;background:transparent;font-size:13px;color:#3A362F}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.compose{display:flex;flex-direction:column;gap:10px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px}
.compose .btns{align-items:center}
textarea.nt-area{width:100%;min-height:120px;border:1.5px solid var(--ctl);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5;resize:vertical;background:#fff;font-family:inherit;color:inherit}
textarea.nt-area:focus{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.note{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.note.pin{border-color:#B7D3CA;background:#FBFDFC}
.nhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.nhead .grow{flex:1}
.nmini{min-height:36px;padding:0 12px;font-size:13px}
.nline{display:flex;align-items:flex-start;gap:8px}
.nline .ntx{flex:1;min-width:0;text-align:left;background:transparent;border:0;font-size:16px;line-height:1.5;padding:6px 6px;border-radius:8px;cursor:text;overflow-wrap:anywhere;color:inherit}
.nline .ntx:hover{background:rgba(0,0,0,.05)}
.nline .tobtn{flex:0 0 auto;min-height:36px;padding:0 12px;font-size:13px}
.nline.conv .ntx{color:var(--muted);text-decoration:line-through}
.nblank{height:8px}
.ntitle{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:transparent;border:0;padding:4px 0;font-size:17px;font-weight:700;color:inherit;min-height:36px;overflow-wrap:anywhere}
.ntitle svg{flex:0 0 auto;transition:transform .15s}
.ntitle[aria-expanded="true"] svg{transform:rotate(90deg)}
.nprev{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;font-size:15px;line-height:1.5;color:var(--muted);cursor:pointer;overflow-wrap:anywhere}
.nbody{font-size:16px;line-height:1.6;overflow-wrap:anywhere;user-select:text;padding:6px 2px}
.nbadge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;width:fit-content}
.nbadge.jalan{background:var(--tint);color:var(--accent-d)}
.nbadge.tuntas{background:#E3EFE0;color:#2F5D2B}
.ntasks{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#F7F5EF;border-radius:12px}
.ntrow{display:flex;align-items:center;gap:8px;min-height:36px}
.ntrow button{background:transparent;border:0;text-align:left;font-size:15px;color:inherit;padding:4px 2px;flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.ntrow{flex-wrap:wrap}.ntrow .pj{background:#EDEAE2;color:#4A453D;padding:2px 8px;border-radius:999px}
.ntrow .st{flex:0 0 auto;font-size:12px;color:var(--muted)}
.ntrow.d button{text-decoration:line-through;color:var(--muted)}
.ntrow .dot{flex:0 0 auto;width:14px;height:14px;border-radius:50%;border:2px solid #B9B2A3}
.ntrow.d .dot{background:var(--accent);border-color:var(--accent)}
input.ntitle-in{width:100%;min-height:44px;border:1.5px solid var(--ctl);border-radius:12px;padding:0 14px;font-size:17px;font-weight:600;font-family:inherit;color:inherit;background:#fff}
input.ntitle-in:focus{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.chip.nl{background:#F1EBDD;color:#5A4E2E}
.fromsel{margin-bottom:14px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(43,107,97,.45)}100%{box-shadow:0 0 0 4px rgba(43,107,97,0)}}
.cvbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--tint);border-radius:12px}
.main.wmain{padding:40px 48px}
.wrap.wide{max-width:1760px}
.wrap.wide>header{max-width:760px;width:100%}
.topgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}
.topgrid>div{display:flex;flex-direction:column;gap:20px}

.hsec{background:#fff;border:1px solid var(--line);border-radius:16px}

kbd{font-family:inherit;font-size:13px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--bg)}

.setc{padding:6px 18px;display:flex;flex-direction:column}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}

.okb{font-size:13px;font-weight:600;color:var(--accent-d);background:var(--tint);border-radius:999px;padding:6px 12px}
.bad{color:#8A3A12;background:#F6E3BE}
.tgl{min-width:84px}

.masonry .note{break-inside:avoid;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#23211E;color:#fff;padding:12px 20px;border-radius:14px;font-size:15px;z-index:10;animation:rise .25s ease-out}

.nav .mob{display:none}
.addbtn{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.finput .addbtn{background:#8FD1BF;color:#12201C}

.fbar{position:sticky;top:0;z-index:6;margin:0 auto 14px;max-width:1100px;padding:10px 14px;border-radius:16px;background:#1E2926;color:#F2F0EA;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(0,0,0,.18)}

.fbar.over{background:#7A3F0C}

.fbar .dot{width:10px;height:10px;border-radius:50%;background:#8FD1BF;flex:0 0 auto;animation:pulse 2s ease-in-out infinite}

.nowtag{background:#DCEFE8;color:#1F5A4B}
.syf{display:flex;flex-direction:column;gap:6px;max-width:560px}
.syf label{font-size:14px;font-weight:600}

.syf input:focus{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.sybox{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1.5;max-width:560px}
.sybox.ok{border-color:#B7D3CA}
.sybox.err{background:#F9DCD6;color:#6E1D12;border-color:#E9B5AB}

.steps-h{max-width:560px;font-size:15px;line-height:1.6;color:#4A453D}
.steps-h ol{margin:6px 0 0;padding-left:20px}
.bk{font-size:12.5px;line-height:1.45;color:var(--muted);padding:2px 4px;display:flex;flex-direction:column;gap:6px}
.bk.warn .bkt{color:#7A3F0C;background:#FBE8D2;border-radius:10px;padding:8px 10px}
.bk.ok .bkt{color:#2F5D2B}
.side-foot .bk button{min-height:34px;font-size:12.5px}
.hint{font-size:12px;color:var(--muted);padding:0 4px;line-height:1.5}
.errbar{margin:0 auto 18px;max-width:760px;padding:12px 16px;border-radius:14px;background:#F9DCD6;color:#6E1D12;font-size:14.5px;line-height:1.5}
.wmain .errbar{max-width:none}
.carry{flex-direction:column;align-items:stretch}
.carry .crow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.carry .crow span{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.carry .crow .btn-o{min-height:36px;padding:0 12px;font-size:13px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.trow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.trow .btn-o{min-height:38px;font-size:13px}
.tsec{display:flex;flex-direction:column;gap:8px}
.tsec h2{font-size:16px;margin:8px 0 2px}
.sres{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;color:inherit;cursor:pointer}
.sres b{font-size:15px}
.tdel{flex:0 0 40px;width:40px;height:40px}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* daftar di catatan */
.nl{white-space:pre-wrap;min-height:1.6em}
.nl.br{min-height:.7em}
.nl.li,.nl.ck{position:relative;padding-left:calc(var(--lv,0)*22px + 22px)}
.nl.li::before{content:"\2022";position:absolute;left:calc(var(--lv,0)*22px + 6px);color:var(--muted)}
.nl.nm{padding-left:calc(var(--lv,0)*22px + 30px)}
.nl.nm::before{content:attr(data-n);left:calc(var(--lv,0)*22px);width:22px;text-align:right}
.nl.ck .ckb{position:absolute;left:calc(var(--lv,0)*22px + 2px);top:3px;width:18px;height:18px;padding:0;border-radius:5px;border:2px solid var(--ctl);background:#fff;cursor:pointer}
.nl.ck .ckb::after{content:"";position:absolute;left:3px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);opacity:0}
.nl.ck.on .ckb{background:var(--accent);border-color:var(--accent)}.nl.ck.on .ckb::after{opacity:1}
.nl.ck.on span{color:var(--muted);text-decoration:line-through}
.ltool{display:flex;gap:6px;flex-wrap:wrap}
.ltool button{min-width:42px;min-height:38px;padding:0 10px;border:1.5px solid #B9B2A3;border-radius:10px;background:#fff;font-size:16px;color:#3A362F}
.cvbox textarea.ntt{flex:1 1 220px;min-height:40px;border:1.5px solid var(--ctl);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;line-height:1.4;resize:none;overflow:hidden}
.lnk{align-self:flex-start;background:none;border:0;color:var(--accent-d);font-size:13px;font-weight:600;padding:6px 0;min-height:32px}
.focus .lnk{color:#8FD1BF}
/* jadwal dan tenggat */
.dwrap{position:relative;display:inline-flex}
.dhid{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0;padding:0}
.dchip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:#4A453D;background:#EDEAE2;padding:4px 10px;border-radius:999px;border:0}
button.dchip{cursor:pointer}
.dchip.soon{background:#FBE8D2;color:#7A3F0C}
.dchip.now{background:#F3D3A8;color:#5A3200}
.wrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wrow .tl{font-size:13px;font-weight:600;color:#3A362F;min-width:52px}
.pagi .crow{flex-wrap:wrap}
.carry .t{flex:0 0 auto}
.carry .crow .ct{flex:1 1 200px;min-width:0;font-size:15px;overflow-wrap:anywhere}
.pagi .crow .dwrap{flex:0 0 auto}
.pagi .crow .btns{flex:0 0 auto}
/* minggu */
.wrap.wk{max-width:1240px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wday{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wday h3,.wpool h3{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.wday h3 span:first-child{overflow-wrap:anywhere}
.wday.over,.wpool.over{outline:2px dashed var(--accent);background:var(--tint)}
.wblock{display:flex}
.wcard{width:100%;text-align:left;padding:9px 11px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;line-height:1.35;overflow-wrap:anywhere;cursor:grab;color:inherit;min-height:40px}
.wcard small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.wdue{font-size:12px;color:#7A3F0C;background:#FBE8D2;border-radius:8px;padding:4px 8px;overflow-wrap:anywhere}
.wempty{padding:4px 2px}
.wpool{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px dashed #B9B2A3;border-radius:18px}
.wpoolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
@media (max-width:1100px){.week{grid-template-columns:1fr}.wday{min-height:0}}
/* tombol + tangkap cepat */
.fab{display:none}
.qback{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.qsheet{width:100%;max-width:560px;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.qsheet textarea.nt-area{min-height:64px;resize:none;overflow:hidden}
@media (min-width:761px){.qback{align-items:center}.qsheet{border-radius:22px}}
@media (max-width:760px){.fab{display:flex;position:fixed;right:16px;bottom:76px;z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:5;flex:none;flex-direction:row;padding:6px 8px;gap:0;justify-content:space-around;border-top:1px solid var(--line);height:auto;overflow:visible;align-self:auto}
  .brand,.side-foot{display:none}
  .nav .desk{display:none}
  .nav .mob{display:flex}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex:1;justify-content:center;padding:0 2px;font-size:12.5px;white-space:nowrap}
  .nav .count{margin-left:3px;font-size:11px}
  .main{padding:28px 14px 96px}
  h1{font-size:30px}
  .focus{padding:20px 14px 28px}
  .focus h1{font-size:28px}
  .stats{grid-template-columns:1fr}
  .psel{max-width:120px}
}

/* ===== Rumah baru (Hari Ini sebagai satu-satunya halaman utama) ===== */
:root{--chip:#EDEAE2;--warm:#FBE8D2;--warm-t:#7A3F0C}
.main{padding:28px 32px 56px}
.h-page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.h-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.h-top h1{font-size:34px;letter-spacing:-.01em}
.h-clock{margin-top:6px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}.h-clock b{color:var(--text);font-weight:600}
.h-dock{display:flex;gap:8px;flex-wrap:wrap}
.h-dk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:66px;padding:10px 8px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted)}
.h-dk svg{color:var(--text)}
.h-dk .n{position:absolute;top:4px;right:6px;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px}
.h-cols{display:grid;grid-template-columns:380px minmax(0,1fr);gap:28px;align-items:start}
.h-left,.h-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.h-card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.h-h{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.h-acc{display:none;width:100%;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:0;padding:4px 2px;font-size:15px;font-weight:600;text-align:left;color:inherit}
.h-acc-r{display:flex;gap:8px;align-items:center}
.h-badge{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}.h-badge.warm{background:var(--warm);color:var(--warm-t)}
.h-dec{padding:14px;display:flex;flex-direction:column;gap:6px}
.h-it{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;flex-wrap:wrap}
.h-it .ct{flex:1 1 150px;min-width:0;overflow-wrap:anywhere}
.h-it .btns{flex:0 0 auto}.h-it .btns .btn-o{min-height:34px;padding:0 12px;font-size:13px}
.h-reason{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-bottom:3px;background:var(--chip);color:var(--muted)}
.h-reason.warm{background:var(--warm);color:var(--warm-t)}.h-reason.new{background:var(--tint);color:var(--accent-d)}
.h-pins{padding:14px;display:flex;flex-direction:column}
.h-pin{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 2px;color:inherit}
.h-pin b{font-size:14px;display:block}
.h-pin span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.h-tuang{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.h-l{font-size:13px;font-weight:600;color:var(--muted)}
.h-tuang textarea{width:100%;min-height:96px;resize:none;border:1.5px solid var(--ctl);border-radius:12px;background:transparent;padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;color:inherit}
.h-tuang textarea:focus{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.h-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.h-chips .dwrap{flex:0 0 auto}
.h-ch{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--ctl);background:transparent;font-size:13px;font-weight:500;white-space:nowrap;flex:0 0 auto;color:var(--text);cursor:pointer}

<body>
<div id="root"></div>
<div id="toast-slot" role="status" aria-live="polite"></div>
<div id="quick-slot"></div>
<div id="modal-slot"></div>
<form id="gform" autocomplete="off" onsubmit="return false"><button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>
<input type="file" id="importfile" accept=".json,.txt,application/json,text/plain" hidden>

<script>
(function(){
'use strict';

/* ---------- Data ---------- */
var KEY='langkah.v1';
var MIG=false;
var S=load();
var LASTH={};
function hashItem(x){var c={};for(var k in x)if(k!=='updatedAt')c[k]=x[k];return JSON.stringify(c);}
var COLS=['tasks','areas','projects','notes'];
function snapHashes(){LASTH={};COLS.forEach(function(c){S[c].forEach(function(x){LASTH[c+':'+x.id]=hashItem(x);});});}
/* setiap item yang berubah diberi cap waktu, dipakai untuk menggabungkan data antar perangkat */
function stamp(){
  var t=new Date().toISOString();
  COLS.forEach(function(c){S[c].forEach(function(x){
    var k=c+':'+x.id,h=hashItem(x);
    if(LASTH[k]!==h){ if(LASTH[k]!==undefined||!x.updatedAt)x.updatedAt=t; LASTH[k]=h; }
  });});
}
snapHashes();
var PREFKEY='langkah.pref';
var PREF=(function(){try{return JSON.parse(localStorage.getItem(PREFKEY))||{};}catch(e){return {};}})();
function savePref(){try{localStorage.setItem(PREFKEY,JSON.stringify(PREF));}catch(e){}}
function canWide(){return window.innerWidth>=1500;}
function W(){return canWide()&&!PREF.calm;}
function wrapOpen(){return '<div class="wrap'+(W()?' wide':'')+'">';}
var ui={cap:{proj:'',sched:'',due:''},capPop:'',filter:'today',modal:null,decAll:false,stack:[],ord:{},capDraft:'',quickOpen:false,quickType:'task',quickText:'',weekOff:0,view:'today',cur:null,noteId:null,noteSort:'upd',lastView:'',trailId:null,timerPick:false,overShown:false,exp:{},edit:null,dashOpen:{},dashAll:false,dashF:'open',noteProj:'',todayFilter:'all',doneFilter:'all',laterFilter:'all',capType:'task',noteQ:'',noteDraft:'',noteDraftTitle:'',noteFilter:'all',gq:'',saveErr:false,undo:null,trashConfirm:false,ntask:null,selText:'',fromNote:'',scrollTo:'',convert:null,capProject:'',toast:'',refocus:null};

function load(){
  var r=null; try{r=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!r||!Array.isArray(r.tasks))r={tasks:[]};
  r.areas=Array.isArray(r.areas)?r.areas:[];
  r.projects=Array.isArray(r.projects)?r.projects:[];
  r.notes=Array.isArray(r.notes)?r.notes:[];
  r.sess=(r.sess&&typeof r.sess==='object'&&!Array.isArray(r.sess))?r.sess:{};
  if(r.focus&&r.focus.id&&!r.sess[r.focus.id]){r.sess[r.focus.id]={id:r.focus.id,start:r.focus.start,timerMin:r.focus.timerMin||0,upd:new Date().toISOString()};MIG=true;}
  delete r.focus;
  r.tomb=(r.tomb&&typeof r.tomb==='object'&&!Array.isArray(r.tomb))?r.tomb:{};
  r.tasks.forEach(function(t){ if(!('projectId' in t))t.projectId=null; if(!('noteId' in t))t.noteId=null; if(!Array.isArray(t.steps))t.steps=[]; if(!validYmd(t.sched))delete t.sched; if(!validYmd(t.due))delete t.due; });
  var nowIso=new Date().toISOString();
  r.tasks.forEach(function(t){
    if(t.status==='today'&&!t.todayAt){t.todayAt=nowIso;MIG=true;}
    if(t.status==='trash'&&!t.trashedAt){t.trashedAt=nowIso;MIG=true;}
  });
  r.areas.forEach(function(a){if(a.archived&&!a.archivedAt){a.archivedAt=nowIso;MIG=true;}});
  r.projects.forEach(function(p){if(p.archived&&!p.archivedAt){p.archivedAt=nowIso;MIG=true;}});
  r.notes.forEach(function(n){
    if(n.deleted&&!n.deletedAt){n.deletedAt=nowIso;MIG=true;}
    if(typeof n.title!=='string')n.title='';
    if(n.conv){Object.keys(n.conv).forEach(function(k){var tk=null;r.tasks.forEach(function(x){if(x.id===n.conv[k])tk=x;});if(tk&&!tk.noteId)tk.noteId=n.id;});}
  });
  return r;
}
function save(){
  stamp();
  try{localStorage.setItem(KEY,JSON.stringify(S)); if(typeof ui!=='undefined'&&ui.saveErr){ui.saveErr=false;}}
  catch(e){ if(typeof ui!=='undefined'&&!ui.saveErr){ui.saveErr=true;toast('Gagal menyimpan ke browser. Segera cadangkan data.');} }
  if(typeof fsQueue==='function')fsQueue();
  if(typeof syQueue==='function')syQueue();
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function now(){return new Date().toISOString();}
function dayOf(iso){return new Date(iso).toDateString();}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(id){for(var i=0;i<S.tasks.length;i++){if(S.tasks[i].id===id)return S.tasks[i];}return null;}
function areaById(id){for(var i=0;i<S.areas.length;i++){if(S.areas[i].id===id)return S.areas[i];}return null;}
function projById(id){for(var i=0;i<S.projects.length;i++){if(S.projects[i].id===id)return S.projects[i];}return null;}
function touch(t){t.updatedAt=now();}
function addTask(title,status,projectId){
  var t={id:uid(),title:title,status:status,projectId:projectId||null,noteId:null,createdAt:now(),updatedAt:now(),doneAt:null,steps:[]};
  S.tasks.push(t); return t;
}
function noteById(id){for(var i=0;i<S.notes.length;i++){if(S.notes[i].id===id)return S.notes[i];}return null;}
function addNote(text,projectId,title){
  var n={id:uid(),title:title||'',text:text,projectId:projectId||null,pinned:false,deleted:false,createdAt:now(),updatedAt:now()};
  S.notes.push(n); return n;
}
function noteTitle(n){
  if(n.title&&n.title.trim())return n.title.trim();
  var l=n.text.split('\n').filter(function(x){return x.trim();}); return l.length?(cleanLine(l[0])||l[0].trim()):'Tanpa judul';
}
function noteBody(n){
  var lines=n.text.split('\n');
  if(!(n.title&&n.title.trim())){var i=0;while(i<lines.length&&!lines[i].trim())i++;lines=lines.slice(i+1);}
  return lines.join('\n').replace(/^\n+/,'').replace(/\s+$/,'');
}
function projShort(t){var p=t.projectId?projById(t.projectId):null;return p&&!p.archived?p.name:'Tanpa projek';}
function noteTasks(n){return S.tasks.filter(function(t){return t.noteId===n.id&&t.status!=='trash';});}
function noteState(n){
  var l=noteTasks(n); if(!l.length)return {k:'plain',n:0,d:0};
  var d=l.filter(function(t){return t.status==='done';}).length;
  return {k:d===l.length?'tuntas':'jalan',n:l.length,d:d};
}
function noteOK(t){return !ui.fromNote||t.noteId===ui.fromNote;}
function noteBadge(st){
  if(st.k==='plain')return '';
  return st.k==='tuntas'?'<span class="nbadge tuntas">\u2713 Tuntas \u00b7 '+st.n+' tugas</span>':'<span class="nbadge jalan">Berjalan \u00b7 '+st.d+' dari '+st.n+' selesai</span>';
}
function noteChip(t){
  var n=t.noteId?noteById(t.noteId):null; if(!n||n.deleted)return '';
  var ti=noteTitle(n); if(ti.length>26)ti=ti.slice(0,25)+'\u2026';
  return '<button class="chip nl" type="button" data-act="opennote" data-id="'+n.id+'" title="Buka catatan asal">Catatan: '+esc(ti)+'</button>';
}
function noteSel(mode){
  var ns=S.notes.filter(function(n){return !n.deleted&&noteTasks(n).some(function(t){return mode==='done'?t.status==='done':(mode==='later'?t.status==='later':t.status==='today');});});
  if(ui.fromNote&&!ns.some(function(n){return n.id===ui.fromNote;}))ui.fromNote='';
  if(!ns.length)return '';
  return '<div class="fromsel"><label class="sr" for="fromnote">Filter dari catatan</label><select id="fromnote" class="psel" data-change="fromnote" style="max-width:320px"><option value="">Dari catatan: semua</option>'+
    ns.map(function(n){return '<option value="'+n.id+'"'+(n.id===ui.fromNote?' selected':'')+'>'+esc(noteTitle(n))+'</option>';}).join('')+'</select></div>';
}
function setStatus(t,st){
  var prev=t.status;
  if(st==='trash'&&prev!=='trash'){t.prevStatus=prev;t.trashedAt=now();}
  if(st==='done'&&prev!=='done')t.doneFrom=prev;
  t.status=st;touch(t);
  if(st==='done')t.doneAt=now();else t.doneAt=null;
  if(st==='today'&&prev!=='today')t.todayAt=now();
}
/* tugas yang dibuka lagi kembali ke tempat asalnya */
function reopenTo(t){return (t.doneFrom==='later'||t.doneFrom==='inbox')?'later':'today';}
function pendingSteps(t){return t.steps.filter(function(x){return !x.done;}).length;}
function findStep(t,sid){for(var i=0;i<t.steps.length;i++){if(t.steps[i].id===sid)return t.steps[i];}return null;}
function curStep(t){for(var i=0;i<t.steps.length;i++){if(!t.steps[i].done)return {step:t.steps[i],index:i};}return null;}
/* status tugas mengikuti langkahnya */
function syncStatus(t){
  if(!t.steps.length)return null;
  if(pendingSteps(t)===0){ if(t.status!=='done'){setStatus(t,'done');return 'done';} }
  else if(t.status==='done'){ setStatus(t,reopenTo(t)); return 'reopened'; }
  return null;
}
function isOpen(k,def){return Object.prototype.hasOwnProperty.call(ui.exp,k)?!!ui.exp[k]:!!def;}
function projLabel(t){
  var p=t.projectId?projById(t.projectId):null; if(!p||!projActive(p))return '';
  return projPathText(p);
}
function projOptions(sel){
  var h='<option value="">Tanpa projek</option>';
  projTreeList().forEach(function(p){h+='<option value="'+esc(p.id)+'"'+(p.id===sel?' selected':'')+'>'+esc(projPathText(p))+'</option>';});
  return h;
}

/* inbox yang dibiarkan sampai hari berikutnya masuk Nanti otomatis */
function autoSweep(){
  var today=new Date().toDateString(), ch=false;
  S.tasks.forEach(function(t){ if(t.status==='inbox'&&dayOf(t.createdAt)!==today){t.status='later';touch(t);ch=true;} });
  var td=ymd(); S.tasks.forEach(function(t){ if(t.status==='later'&&t.sched&&t.sched<=td){setStatus(t,'today');delete t.sched;ch=true;} });
  if(ch)save();
}

/* ---------- Sampah & urungkan ---------- */
function trashTask(t){
  setStatus(t,'trash'); save();
  var id=t.id; toast('Tugas dibuang.',function(){restoreTask(id);});
}
function restoreTask(id){
  var t=byId(id); if(!t||t.status!=='trash')return;
  var to=t.prevStatus||'later';
  if(to==='trash'||to==='done')to='later';
  if(to==='inbox'&&dayOf(t.createdAt)!==new Date().toDateString())to='later';
  t.status=to; t.trashedAt=null; touch(t);
  if(to==='today')t.todayAt=now();
}
function delNote(n){
  n.deleted=true; n.deletedAt=now(); save();
  var id=n.id; toast('Catatan dihapus.',function(){restoreNote(id);});
}
function restoreNote(id){var n=noteById(id); if(n){n.deleted=false;n.deletedAt=null;}}
function delProj(p){
  p.archived=true; p.archivedAt=now(); delete p.archivedBy;
  projDesc(p.id).forEach(function(c){if(!c.archived){c.archived=true;c.archivedAt=p.archivedAt;c.archivedBy=p.id;}}); save();
  var id=p.id; toast('Projek dihapus. Tugasnya pindah ke "Belum masuk projek".',function(){restoreProj(id);});
}
function restoreProj(id){
  var p=projById(id); if(!p)return; p.archived=false; p.archivedAt=null; delete p.archivedBy;
  S.projects.forEach(function(c){if(c.archivedBy===p.id){c.archived=false;c.archivedAt=null;delete c.archivedBy;}});
  var a=areaById(p.areaId); if(a&&a.archived){a.archived=false;a.archivedAt=null;}
}
function delArea(a){
  a.archived=true; a.archivedAt=now();
  S.projects.forEach(function(p){ if(p.areaId===a.id&&!p.archived){p.archived=true;p.archivedAt=a.archivedAt;p.archivedBy=a.id;} });
  save(); var id=a.id; toast('Kerjaan dihapus. Tugasnya pindah ke "Belum masuk projek".',function(){restoreArea(id);});
}
function restoreArea(id){
  var a=areaById(id); if(!a)return; a.archived=false; a.archivedAt=null;
  S.projects.forEach(function(p){ if(p.archivedBy===a.id){p.archived=false;p.archivedAt=null;delete p.archivedBy;} });
}
/* hapus permanen: cut = ISO batas waktu, null = semua isi sampah */
function purge(cut){
  function old(ts){return cut===null||!!(ts&&ts<cut);}
  var before=JSON.stringify([S.tasks.length,S.notes.length,S.areas.length,S.projects.length]), tn=now();
  function gone(id){S.tomb[id]=tn;}
  S.tasks=S.tasks.filter(function(t){ if(t.status==='trash'&&old(t.trashedAt)){gone(t.id);return false;} return true; });
  S.notes=S.notes.filter(function(n){ if(n.deleted&&old(n.deletedAt)){gone(n.id);return false;} return true; });
  var goneA={}; S.areas=S.areas.filter(function(a){ if(a.archived&&old(a.archivedAt)){goneA[a.id]=1;gone(a.id);return false;} return true; });
  var goneP={}; S.projects=S.projects.filter(function(p){ if(p.archived&&(old(p.archivedAt)||goneA[p.areaId])){goneP[p.id]=1;gone(p.id);return false;} return true; });
  S.tasks.forEach(function(t){ if(t.projectId&&goneP[t.projectId])t.projectId=null; });
  return before!==JSON.stringify([S.tasks.length,S.notes.length,S.areas.length,S.projects.length]);
}
function trashData(){
  return {
    tasks:S.tasks.filter(function(t){return t.status==='trash';}).sort(function(a,b){return (a.trashedAt||'')<(b.trashedAt||'')?1:-1;}),
    notes:S.notes.filter(function(n){return n.deleted;}).sort(function(a,b){return (a.deletedAt||'')<(b.deletedAt||'')?1:-1;}),
    areas:S.areas.filter(function(a){return a.archived;}),
    projs:S.projects.filter(function(p){ if(!p.archived)return false; var a=areaById(p.areaId); if(a&&a.archived&&p.archivedBy===a.id)return false; var pb=p.archivedBy?projById(p.archivedBy):null; return !(pb&&pb.archived); })
  };
}
function trashCount(){var d=trashData();return d.tasks.length+d.notes.length+d.areas.length+d.projs.length;}
function ago(iso){
  if(!iso)return '';
  var t0=new Date();t0.setHours(0,0,0,0); var x=new Date(iso);x.setHours(0,0,0,0);
  var days=Math.round((t0-x)/864e5);
  return days<=0?'hari ini':(days===1?'kemarin':days+' hari lalu');
}
/* tugas Hari Ini yang terbawa dari hari sebelumnya */
function staleToday(){var d=new Date().toDateString();return S.tasks.filter(function(t){return t.status==='today'&&t.todayAt&&dayOf(t.todayAt)!==d;}).sort(byCreated);}
function carryBox(){
  var l=staleToday(); if(!l.length)return '';
  var h='<section class="card triage carry" aria-label="Tugas dari hari sebelumnya"><div class="t"><b style="font-size:16px">Dari hari sebelumnya: '+l.length+' tugas belum selesai</b>'+
    '<span class="small">Tidak apa-apa. Mau tetap dikerjakan hari ini, atau simpan dulu di Nanti?</span></div>';
  h+=l.map(function(t){return '<div class="crow"><span>'+esc(t.title)+'</span><button class="btn-o" type="button" data-act="carry" data-to="keep" data-id="'+t.id+'">Tetap</button><button class="btn-o" type="button" data-act="carry" data-to="later" data-id="'+t.id+'">Nanti</button></div>';}).join('');
  h+='<div class="btns"><button class="btn" type="button" data-act="carry" data-to="keep" style="padding:0 14px;font-size:14px">Tetap semua di Hari Ini</button><button class="btn-o" type="button" data-act="carry" data-to="later">Pindah semua ke Nanti</button></div></section>';
  return h;
}

/* ---------- Sinkron GitHub ---------- */
var SY={cfg:null,state:'off',msg:'',last:null,sha:null,timer:null,busy:false,pending:false,etag:null,canon:null,authFail:false};
try{SY.cfg=JSON.parse(localStorage.getItem('langkah.sync'))||null;}catch(e){}
if(SY.cfg&&SY.cfg.repo&&SY.cfg.token)SY.state='idle'; else SY.cfg=null;
function b64enc(str){return btoa(unescape(encodeURIComponent(str)));}
function b64dec(b){return decodeURIComponent(escape(atob(b.replace(/\s/g,''))));}
function syErr(status,body){
  var e=new Error(''); e.status=status;
  if(status===401)e.message='Token ditolak. Cek apakah tokennya benar dan belum kedaluwarsa.';
  else if(status===403)e.message='Token tidak punya izin (perlu Contents: Read and write) atau batas permintaan GitHub tercapai.';
  else if(status===404)e.message='Repo atau file tidak ditemukan, atau token tidak diberi akses ke repo itu.';
  else e.message='GitHub menjawab galat '+status+'.';
  return e;
}
function syFetch(path,opt){
  var c=SY.cfg; opt=opt||{};
  var ifn=opt.ifNone; delete opt.ifNone;
  opt.headers={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(ifn)opt.headers['If-None-Match']=ifn;
  opt.cache='no-store';
  return fetch('https://api.github.com/repos/'+c.repo+path,opt).catch(function(){var e=new Error('Tidak bisa menghubungi GitHub. Cek koneksi internet, atau jaringan kantor mungkin memblokir api.github.com.');e.net=true;throw e;});
}
function syFile(){return '/contents/'+encodeURIComponent((SY.cfg.path||'data.json'));}
function syGetRemote(cond){
  var opt={}; if(cond&&SY.etag)opt.ifNone=SY.etag;
  return syFetch(syFile(),opt).then(function(r){
    if(r.status===304)return {notModified:true};
    if(r.status===404)return null;
    if(!r.ok)throw syErr(r.status);
    var et=null; try{et=r.headers&&r.headers.get&&r.headers.get('etag');}catch(x){}
    return r.json().then(function(j){
      if(j.encoding!=='base64'||typeof j.content!=='string'){var e=new Error('File data di GitHub terlalu besar untuk dibaca (lebih dari 1 MB).');throw e;}
      var d; try{d=JSON.parse(b64dec(j.content));}catch(x){var e2=new Error('Isi file data di GitHub tidak bisa dibaca. Jangan diubah manual.');throw e2;}
      return {data:d,sha:j.sha,etag:et||null};
    });
  });
}
function syPut(data,sha){
  var body={message:'Langkah: sinkron '+new Date().toISOString().slice(0,16).replace('T',' '),content:b64enc(JSON.stringify(data,null,1))};
  if(sha)body.sha=sha;
  return syFetch(syFile(),{method:'PUT',body:JSON.stringify(body)}).then(function(r){
    if(r.status===409||r.status===422){var e=new Error('konflik');e.conflict=true;throw e;}
    if(!r.ok)throw syErr(r.status);
    return r.json().then(function(j){return j.content&&j.content.sha;});
  });
}
function syMerge(L,R){
  var tomb={}; [L.tomb||{},(R&&R.tomb)||{}].forEach(function(t){Object.keys(t).forEach(function(k){if(!tomb[k]||t[k]>tomb[k])tomb[k]=t[k];});});
  var cut=new Date(Date.now()-60*864e5).toISOString(); Object.keys(tomb).forEach(function(k){if(tomb[k]<cut)delete tomb[k];});
  function mc(a,b){
    var m={},order=[]; (a||[]).forEach(function(x){m[x.id]=x;order.push(x.id);});
    (b||[]).forEach(function(x){var y=m[x.id]; if(!y){order.push(x.id);m[x.id]=x;} else if((x.updatedAt||'')>(y.updatedAt||''))m[x.id]=x;});
    return order.filter(function(id){return !tomb[id];}).map(function(id){return m[id];});
  }
  var sess={}, scut=new Date(Date.now()-2*864e5).toISOString();
  [L.sess||{},(R&&R.sess)||{}].forEach(function(m){Object.keys(m).forEach(function(k){var x=m[k]; if(!x)return; var y=sess[k]; if(!y||(x.upd||'')>(y.upd||''))sess[k]=x;});});
  Object.keys(sess).forEach(function(k){if(sess[k].end&&(sess[k].upd||'')<scut)delete sess[k];});
  return {tasks:mc(L.tasks,R&&R.tasks),areas:mc(L.areas,R&&R.areas),projects:mc(L.projects,R&&R.projects),notes:mc(L.notes,R&&R.notes),tomb:tomb,sess:sess};
}
function syCanon(d){
  function so(a){return (a||[]).slice().sort(function(x,y){return x.id<y.id?-1:1;});}
  var tk={}; Object.keys(d.tomb||{}).sort().forEach(function(k){tk[k]=d.tomb[k];});
  var sk={}; Object.keys(d.sess||{}).sort().forEach(function(k){sk[k]=d.sess[k];});
  return JSON.stringify({t:so(d.tasks),a:so(d.areas),p:so(d.projects),n:so(d.notes),k:tk,s:sk});
}

/* hasil: Promise<true|Error> */
function syncNow(reason){
  if(!SY.cfg)return Promise.resolve(false);
  var auto=(reason!=='manual'&&reason!=='connect');
  if(auto&&SY.authFail)return Promise.resolve(false);
  if(auto&&reason!=='change'&&reason!=='start'&&reason!=='sess'&&SY.lastTs&&Date.now()-SY.lastTs<20000)return Promise.resolve(false);
  if(SY.busy){SY.pending=true;return Promise.resolve(false);}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){SY.state='offline';paintSy();return Promise.resolve(false);}
  SY.busy=true; SY.state='busy'; SY.lastTry=Date.now(); paintSy();
  var attempts=0;
  function once(){
    var clean=SY.canon!==null&&syCanon(syLocal())===SY.canon&&auto&&attempts===0;
    return syGetRemote(clean).then(function(r){
      if(r&&r.notModified)return true;
      var force=SY.forceUntil&&Date.now()<SY.forceUntil;
      var L=syLocal(), M=force?L:syMerge(L,r&&r.data);
      var changedLocal=syCanon(M)!==syCanon(L);
      if(changedLocal){
        SY.applying=true;
        S.tasks=M.tasks;S.areas=M.areas;S.projects=M.projects;S.notes=M.notes;S.tomb=M.tomb;S.sess=M.sess;
        snapHashes();
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        SY.applying=false; autoSweep();
        if(typeof fsQueue==='function')fsQueue();
        if(ui.view==='focus'&&!F())ui.view='today';
        softRender();
      }
      if(r&&syCanon(M)===syCanon(r.data)){SY.sha=r.sha;SY.etag=r.etag;SY.canon=syCanon(M);return true;}
      var out={app:'langkah',v:1,savedAt:now(),tasks:M.tasks,areas:M.areas,projects:M.projects,notes:M.notes,tomb:M.tomb,sess:M.sess};
      return syPut(out,r&&r.sha).then(function(sha){SY.sha=sha;SY.etag=null;SY.canon=syCanon(M);return true;});
    }).catch(function(e){
      if(e.conflict&&attempts<3){attempts++;return once();}
      throw e;
    });
  }
  return once().then(function(){
    SY.forceUntil=0; SY.busy=false; SY.state='idle'; SY.last=new Date(); SY.lastTs=Date.now(); SY.msg=''; SY.authFail=false; PREF.lastBackup=now(); savePref(); paintSy();
    if(SY.pending){SY.pending=false;syQueue();}
    return true;
  },function(e){
    SY.busy=false; SY.pending=false;
    if(e.net){SY.state='offline';}else{SY.state='err';}
    if(e.status===401||e.status===403)SY.authFail=true;
    SY.msg=e.conflict?'Data berubah terus di perangkat lain. Coba lagi sebentar.':e.message; paintSy(); return e;
  });
}
function syConnect(){
  var repo=val('syrepo').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''), token=val('sytoken');
  var el=document.getElementById('syerr');
  function fail(m){if(el){el.textContent=m;el.style.display='block';}}
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){fail('Tulis nama repo seperti nama-akun/langkah-data.');return;}
  if(!token){fail('Tempel token GitHub dulu.');return;}
  var prev=SY.cfg; SY.cfg={repo:repo,token:token,path:'data.json'};
  fetch('https://api.github.com/repos/'+repo,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},cache:'no-store'}).then(function(r){
    if(r.status===401)throw syErr(401);
    if(r.status===404||r.status===403)throw new Error(r.status===404?'Repo tidak ditemukan, atau token tidak diberi akses ke repo itu.':syErr(403).message);
    if(!r.ok)throw syErr(r.status);
    return r.json();
  },function(){throw new Error('Tidak bisa menghubungi GitHub. Cek koneksi internet, atau jaringan kantor mungkin memblokir api.github.com.');}).then(function(j){
    if(j&&j.private===false&&!window.confirm('Repo ini PUBLIK. Semua orang bisa membaca tugas dan catatanmu. Tetap lanjutkan?')){throw new Error('Dibatalkan. Pakai repo privat.');}
    try{localStorage.setItem('langkah.sync',JSON.stringify(SY.cfg));}catch(e){}
    SY.state='idle'; SY.sha=null; return syncNow('connect');
  }).then(function(res){
    if(res===true){toast('Tersambung. Data digabung dengan GitHub.');ui.view='today';render();}
    else if(res&&res.message){ SY.cfg=prev; try{if(prev)localStorage.setItem('langkah.sync',JSON.stringify(prev));else localStorage.removeItem('langkah.sync');}catch(e){} SY.state=prev?'idle':'off'; fail(res.message); }
  },function(e){SY.cfg=prev;fail(e.message);});
}

var UNDO_KEY='langkah.undo';
function countData(d){var a=0,dn=0;(d.tasks||[]).forEach(function(t){if(t.status==='done')dn++;else if(t.status!=='trash')a++;});return {aktif:a,selesai:dn,catatan:(d.notes||[]).filter(function(n){return !n.deleted;}).length,projek:(d.projects||[]).filter(function(p){return !p.archived;}).length};}
function cntText(c){return c.aktif+' tugas belum selesai, '+c.selesai+' selesai, '+c.catatan+' catatan, '+c.projek+' projek';}
function applyData(d){
  try{localStorage.setItem(KEY,JSON.stringify({tasks:d.tasks,areas:d.areas||[],projects:d.projects||[],notes:d.notes||[],tomb:d.tomb||{},sess:d.sess||{}}));}catch(e){}
  S=load(); snapHashes(); save();
}
function doReplace(d){
  var oldIds={}; COLS.forEach(function(c){S[c].forEach(function(x){oldIds[x.id]=1;});});
  var tomb={}; Object.keys(d.tomb||{}).forEach(function(k){tomb[k]=d.tomb[k];});
  var newIds={}; [d.tasks||[],d.areas||[],d.projects||[],d.notes||[]].forEach(function(a){a.forEach(function(x){newIds[x.id]=1;delete tomb[x.id];});});
  if(SY.cfg||FS.handle){var tn=now();Object.keys(oldIds).forEach(function(id){if(!newIds[id])tomb[id]=tn;});}
  applyData({tasks:d.tasks||[],areas:d.areas||[],projects:d.projects||[],notes:d.notes||[],tomb:tomb,sess:{}});
  if(FS.state==='on'){clearTimeout(FS.timer);fsWrite();}
  if(SY.cfg){SY.forceUntil=Date.now()+600000;clearTimeout(SY.timer);SY.timer=null;syncNow('manual');}
}

/* ---------- Riwayat versi di GitHub ---------- */
function histLoad(){
  if(!SY.cfg)return;
  ui.hist={state:'loading',list:[]}; render();
  syFetch('/commits?path='+encodeURIComponent(SY.cfg.path||'data.json')+'&per_page=100').then(function(r){
    if(!r.ok)throw syErr(r.status);
    return r.json();
  }).then(function(arr){
    var all=(arr||[]).map(function(c){return {sha:c.sha,date:new Date(c.commit&&c.commit.author&&c.commit.author.date||c.commit&&c.commit.committer&&c.commit.committer.date)};}).filter(function(x){return !isNaN(x.date);});
    var out=all.slice(0,5), seen={};
    out.forEach(function(x){seen[x.date.toDateString()]=1;});
    all.slice(5).forEach(function(x){var k=x.date.toDateString();if(!seen[k]){seen[k]=1;out.push(x);}});
    ui.hist={state:'ok',list:out.slice(0,20)}; render();
  }).catch(function(e){ui.hist={state:'err',msg:e.message||'Riwayat tidak bisa dimuat.'};render();});
}
function histPick(sha){
  var it=(ui.hist&&ui.hist.list||[]).filter(function(x){return x.sha===sha;})[0]; if(!it)return;

    var d=JSON.parse(b64dec(j.content||''));
    if(!d||!Array.isArray(d.tasks))throw new Error('Isi versi itu tidak bisa dibaca.');
    restoreFrom(d,'Versi GitHub '+it.date.toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),'github'); render();

function histHTML(){

      if(navigator.storage.persist)navigator.storage.persist().then(function(r){PERSIST=r;if(ui.view==='storage')softRender();},function(){});
    },function(){});

}

function fbKeep(){var f=ui.fb;if(!f)return;var m=document.getElementById('fbmsg'),e=document.getElementById('fbmail');if(m)f.pesan=m.value;if(e)f.email=e.value;}
var FBQ_KEY='langkah.fbq', FBQ_BUSY=false;
function fbQueue(){try{var q=JSON.parse(localStorage.getItem(FBQ_KEY)||'[]');return Array.isArray(q)?q:[];}catch(e){return [];}}
function fbSaveQ(q){try{if(q.length)localStorage.setItem(FBQ_KEY,JSON.stringify(q));else localStorage.removeItem(FBQ_KEY);}catch(e){}}
function fbPost(fields){var body=new URLSearchParams();fields.forEach(function(x){body.append(x[0],x[1]);});return fetch(FB.action,{method:'POST',mode:'no-cors',body:body});}
/* kirim masukan yang tertunda (offline) satu per satu */
function fbFlush(){
  if(!fbOn()||FBQ_BUSY||navigator.onLine===false)return;
  var q=fbQueue(); if(!q.length)return;
  var it=q[0], age=Date.now()-new Date(it.at).getTime();
  if(age>30*864e5||(it.tries||0)>=40){fbSaveQ(q.slice(1));fbFlush();return;}
  FBQ_BUSY=true;
  var f=it.f.map(function(x){return x[0]===FB.info?[x[0],x[1]+' · ditulis '+new Date(it.at).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' (tertunda)']:x;});
  fbPost(f).then(function(){
    FBQ_BUSY=false; fbSaveQ(fbQueue().filter(function(x){return x.id!==it.id;}));
    if(!fbQueue().length)toast('Masukan yang tertunda sudah terkirim. Terima kasih!');
    if(ui.view==='feedback')render(); fbFlush();
  },function(){
    FBQ_BUSY=false; var q2=fbQueue(); q2.forEach(function(x){if(x.id===it.id)x.tries=(x.tries||0)+1;}); fbSaveQ(q2);
  });
}
function fbQueued(fields){
  var q=fbQueue(); q.push({id:uid(),at:now(),f:fields,tries:0}); fbSaveQ(q.slice(-10));
  PREF.fbLast=now(); PREF.rateAsked=true; savePref();
  ui.fb={nilai:0,jenis:'Saran fitur',sent:true,queued:true}; toast('Tersimpan. Akan dikirim otomatis saat tersambung.'); render();
}
function fbSend(){
  fbKeep(); var f=ui.fb; if(!f||!fbOn()||f.busy)return;
  var msg=(f.pesan||'').trim(), mail=(f.email||'').trim();
  if(!msg&&!f.nilai){toast('Pilih bintang atau tulis sesuatu dulu.');return;}
  if(mail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){toast('Alamat email sepertinya belum benar.');return;}
  if(PREF.fbLast&&Date.now()-new Date(PREF.fbLast).getTime()<30000){toast('Tunggu sebentar sebelum mengirim lagi.');return;}
  var fields=[];
  if(FB.jenis)fields.push([FB.jenis,f.jenis]);
  if(FB.nilai&&f.nilai)fields.push([FB.nilai,String(f.nilai)]);
  fields.push([FB.pesan,msg||'(tanpa pesan)']);
  if(FB.email&&mail)fields.push([FB.email,mail]);
  if(FB.info)fields.push([FB.info,devInfo()]);
  if(navigator.onLine===false){fbQueued(fields);return;}
  f.busy=true; toast('Mengirim…');
  fbPost(fields).then(function(){
    PREF.fbLast=now(); PREF.rateAsked=true; savePref();
    ui.fb={nilai:0,jenis:'Saran fitur',sent:true}; toast('Terima kasih! Masukanmu terkirim.'); render(); fbFlush();
  },function(){f.busy=false;fbQueued(fields);});
}

/* ---------- Simpan data di file (Chrome/Edge di komputer) ----------
   File yang dipilih jadi tempat data: dibaca saat aplikasi dibuka, saat kembali ke aplikasi,
   dan berkala; ditulis setiap ada perubahan. Isinya digabung per item dengan data di browser. */
var FS={supported:typeof window.showSaveFilePicker==='function',handle:null,state:'off',name:'',last:null,timer:null,lastMod:0,holdUntil:0,busy:false,msg:''};

function idbGet(cb){idb(function(db){try{var rq=db.transaction('h').objectStore('h').get('data');rq.onsuccess=function(){cb(rq.result||null);};}catch(e){}});}

function fsInit(){

}
function fsData(j){return {tasks:j.tasks||[],areas:j.areas||[],projects:j.projects||[],notes:j.notes||[],tomb:(j.tomb&&typeof j.tomb==='object')?j.tomb:{},sess:(j.sess&&typeof j.sess==='object')?j.sess:{}};}

function fsLoad(force,first){
  if(!FS.handle||FS.state!=='on'||FS.busy||Date.now()<FS.holdUntil)return Promise.resolve(false);
  FS.busy=true;
  return Promise.resolve(FS.handle.getFile()).then(function(f){
    if(!force&&FS.lastMod&&f.lastModified===FS.lastMod){FS.busy=false;return false;}
    return f.text().then(function(txt){
      FS.busy=false; FS.lastMod=f.lastModified;

      if(txt.trim()){
        try{j=JSON.parse(txt);}catch(e){j=undefined;}

          if(first){FS.handle=null;FS.state='off';FS.name='';idbPut(null);toast('File itu bukan data Langkah. Pilih file lain.');fsPaint();return false;}

        }

        S=load(); snapHashes(); autoSweep();

      if(first)toast(R?'File data terhubung. Isinya digabung dengan data di sini.':'File data dibuat. Data tersimpan di '+FS.name+'.');

function fsAttach(h){

function fsConnect(){
  if(!FS.supported)return;
  window.showSaveFilePicker({suggestedName:'langkah-data.json',types:[{description:'Data Langkah',accept:{'application/json':['.json']}}]}).then(fsAttach,
    function(e){ if(e&&e.name==='AbortError')return; toast('Tidak bisa memakai file itu.'); });

function fsWrite(announce){
  if(!FS.handle||FS.state!=='on')return;
  var data=JSON.stringify({app:'langkah',v:1,savedAt:now(),tasks:S.tasks,areas:S.areas,projects:S.projects,notes:S.notes,tomb:S.tomb,sess:S.sess},null,2);
  var h=FS.handle; FS.busy=true;
  Promise.resolve(h.createWritable()).then(function(w){return Promise.resolve(w.write(data)).then(function(){return w.close();});})
  .then(function(){return Promise.resolve(h.getFile()).then(function(f){FS.lastMod=f.lastModified;},function(){});})
  .then(function(){
    FS.busy=false; FS.holdUntil=0; FS.last=new Date(); PREF.lastBackup=now(); savePref(); fsPaint();
    if(announce)toast('Data tersimpan di '+FS.name+'.');
  },function(){FS.busy=false; FS.state='err'; FS.msg='File tidak bisa ditulis. Mungkin dipindah, dihapus, atau sedang dipakai program lain.'; fsPaint(); toast('Gagal menyimpan ke file.');});
}
function fsBanner(){
  if(FS.state==='need')return '<div id="fsbanner" class="errbar fsbar" role="status">Data Langkah disimpan di file <b>'+esc(FS.name)+'</b>. Izinkan browser membukanya supaya data terbaru terbaca. <span class="btns"><button class="btn" type="button" data-act="fsresume">Buka file data</button><button class="btn-o" type="button" data-act="nav" data-view="storage">Pengaturan</button></span></div>';
  if(FS.state==='err')return '<div id="fsbanner" class="errbar fsbar" role="alert">'+esc(FS.msg||'Ada masalah dengan file data.')+' <span class="btns"><button class="btn-o" type="button" data-act="nav" data-view="storage">Lihat pengaturan</button></span></div>';
  return '';
}
function backupInfo(){
  var has=S.tasks.length||S.notes.length, h='', cls='bk';
  var lb=PREF.lastBackup, days=null;
  if(lb){var t0=new Date();t0.setHours(0,0,0,0);var x=new Date(lb);x.setHours(0,0,0,0);days=Math.round((t0-x)/864e5);}
  if(FS.state==='on'){cls+=' ok'; h+='<span class="bkt">Data di file <b>'+esc(FS.name)+'</b>'+(FS.last?' · '+FS.last.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')+'</span>';}
  else if(FS.state==='need'){cls+=' warn';h+='<span class="bkt">File <b>'+esc(FS.name)+'</b> perlu izin lagi.</span><button type="button" data-act="fsresume">Buka file data</button>';}
  else if(FS.state==='err'){cls+=' warn';h+='<span class="bkt">Ada masalah dengan file data.</span>';}
  else if(has&&!lb&&!SY.cfg){cls+=' warn';h+='<span class="bkt">Belum pernah dicadangkan. Data hanya ada di browser ini.</span>';}
  else if(lb){if(days>=7&&!SY.cfg)cls+=' warn';h+='<span class="bkt">Terakhir dicadangkan '+ago(lb)+'.</span>';}
  h+='<button type="button" data-act="nav" data-view="storage">Penyimpanan data…</button>';
  return '<div id="bkinfo" class="'+cls+'">'+h+'</div>';
}

/* ---------- Selectors ---------- */
function byCreated(a,b){return a.createdAt<b.createdAt?-1:1;}
function inbox(){return S.tasks.filter(function(t){return t.status==='inbox';}).sort(byCreated);}
function byDueThenCreated(a,b){var x=a.due||'9999',y=b.due||'9999';return x!==y?(x<y?-1:1):byCreated(a,b);}
function laterList(){return S.tasks.filter(function(t){return t.status==='later';}).sort(byDueThenCreated);}
function todayList(){
  var d=new Date().toDateString();
  var l=S.tasks.filter(function(t){return t.status==='today'||(t.status==='done'&&t.doneAt&&dayOf(t.doneAt)===d);});
  return l.sort(function(a,b){ if((a.status==='done')!==(b.status==='done'))return a.status==='done'?1:-1; return a.status==='done'?byCreated(a,b):byDueThenCreated(a,b); });
}
function doneList(){return S.tasks.filter(function(t){return t.status==='done';}).sort(function(a,b){return a.doneAt<b.doneAt?1:-1;});}
function isOpenT(t){return t.status==='inbox'||t.status==='today'||t.status==='later';}
function countFor(list){var d=0,o=0;list.forEach(function(t){if(t.status==='done')d++;else if(isOpenT(t))o++;});return {done:d,open:o,total:d+o};}
function bar(c){var pct=c.total?Math.round(c.done/c.total*100):0;return '<div class="bar" role="img" aria-label="'+pct+' persen selesai"><i style="width:'+pct+'%"></i></div>';}

function projOptionsFlat(sel){
  var h='<option value="">'+(sel?'Tanpa projek':'+ projek')+'</option>';
  projTreeList().forEach(function(p){h+='<option value="'+esc(p.id)+'"'+(p.id===sel?' selected':'')+'>'+esc(projPathText(p))+'</option>';});
  return h;
}
function projChip(t){
  if(!S.projects.some(function(p){return !p.archived;}))return '';
  var lab=projLabel(t)||'+ projek';
  var w=Math.min(Math.max(lab.length+4,10),38);
  return '<select class="tsel'+(t.projectId&&projLabel(t)?'':' none')+'" data-change="taskproj" data-id="'+t.id+'" aria-label="Projek untuk: '+esc(t.title)+'" style="width:'+w+'ch">'+projOptionsFlat(projLabel(t)?t.projectId:null)+'</select>';
}

function stepsPane(t,mode){
  var n=t.steps.length, dn=n-pendingSteps(t);
  var key=mode==='focus'?'f:'+t.id:t.id, def=mode==='focus'?1:0;
  var open=(mode==='trail')?true:isOpen(key,def);
  var label=n?('Langkah ('+dn+' dari '+n+')'):'Tambah langkah';
  var head='';
  if(mode==='focus')head='<button class="pane-toggle" type="button" data-act="togglesteps" data-key="'+key+'" data-def="'+def+'" aria-expanded="'+(open?'true':'false')+'">'+CHEV+'<span>'+label+'</span></button>';
  else if(mode==='trail')head='<div class="pane-toggle" style="cursor:default"><span>'+label+'</span></div>';
  if(!open)return '<div class="pane">'+head+'</div>';
  var cur=curStep(t), curId=cur?cur.step.id:null, iid='si-'+t.id, ord=!!ui.ord[t.id];
  var rows=t.steps.map(function(s,i){
    var a='data-id="'+t.id+'" data-sid="'+s.id+'"';
    var ed=ui.edit&&ui.edit.type==='step'&&ui.edit.sid===s.id;
    if(ed){
      return '<li class="srow edit" data-sid="'+s.id+'" data-tid="'+t.id+'"><div class="sin"><label class="sr" for="edits">Ubah langkah</label><textarea id="edits" rows="1" data-grow data-enter="savestep" '+a+'>'+esc(s.text)+'</textarea></div></li>';
    }
    return '<li class="srow'+(s.done?' done':'')+(s.id===curId?' cur':'')+'" draggable="true" data-sid="'+s.id+'" data-tid="'+t.id+'">'+
      '<button type="button" class="sc'+(s.done?' on':'')+'" data-act="steptoggle" '+a+' aria-label="'+(s.done?'Batalkan selesai: ':'Tandai selesai: ')+esc(s.text)+'">'+CHECK_S+'</button>'+
      '<button type="button" class="tx" data-act="editstep" '+a+' title="Klik untuk mengubah">'+esc(s.text)+'</button>'+
      (ord?'<button type="button" class="sbtn" data-act="stepup" '+a+' aria-label="Naikkan langkah"'+(i===0?' disabled':'')+'>'+UP+'</button>'+
      '<button type="button" class="sbtn" data-act="stepdown" '+a+' aria-label="Turunkan langkah"'+(i===n-1?' disabled':'')+'>'+DOWN+'</button>'+
      '<button type="button" class="sbtn" data-act="stepdel" '+a+' aria-label="Hapus langkah">'+XI+'</button>':'')+'</li>';
  }).join('');
  return '<div class="pane">'+head+'<div class="pane-body">'+(mode==='row'?timeRow(t):'')+
    (n?'<ul class="steps">'+rows+'</ul><button type="button" class="lnk" data-act="stepord" data-key="'+t.id+'">'+(ord?'Selesai mengatur':'Atur urutan atau hapus langkah')+'</button>':'<div class="small">Belum ada langkah. Tulis satu saja kalau sudah terlintas.</div>')+
    '<div class="sin"><label class="sr" for="'+iid+'">Tambah langkah</label><textarea id="'+iid+'" rows="1" data-grow autocomplete="off" placeholder="Tambah langkah, lalu Enter" data-enter="stepadd" data-id="'+t.id+'"></textarea><button class="addbtn" type="button" data-act="enterbtn" data-key="'+iid+'">Tambah</button></div></div></div>';
}

function taskRow(t,ctx){
  var done=t.status==='done', n=t.steps.length, dn=n-pendingSteps(t);
  var editing=ui.edit&&ui.edit.type==='task'&&ui.edit.id===t.id;
  var open=isOpen(t.id,0);
  var chk='<button type="button" class="chk'+(done?' on':'')+'" data-act="toggle" data-id="'+t.id+'" aria-label="'+(done?'Batalkan selesai: ':'Tandai selesai: ')+esc(t.title)+'">'+CHECK+'</button>';
  var body, actions='';
  if(editing){
    body='<div class="body"><div class="sin"><label class="sr" for="editt">Nama tugas</label><textarea id="editt" rows="1" data-grow data-enter="savetask" data-id="'+t.id+'">'+esc(t.title)+'</textarea></div></div>';
  }else{
    var nanti=(ctx==='dash'&&(t.status==='later'||t.status==='inbox'))?'<span class="plabel">Nanti</span>':'';
    body='<div class="body"><button class="title-btn" type="button" data-act="edittask" data-id="'+t.id+'" title="Klik untuk mengubah nama">'+esc(t.title)+'</button><div class="meta">'+(isLive(t.id)?'<span class="plabel nowtag">Sedang dikerjakan</span>':'')+projChip(t)+noteChip(t)+nanti+dueChip(t)+schedChip(t)+
      '<button class="chip" type="button" data-act="togglesteps" data-key="'+t.id+'" data-def="0" aria-expanded="'+(open?'true':'false')+'">'+CHEV_S+(n?(dn+' dari '+n+' langkah'):'+ langkah')+'</button></div></div>';
    if(ctx==='today'&&!done)actions='<div class="btns"><button class="btn-o btn-g" type="button" data-act="start" data-id="'+t.id+'">'+(isLive(t.id)?'Lanjutkan':'Mulai')+'</button><button class="btn-o" type="button" data-act="postpone" data-id="'+t.id+'">Tunda</button><button class="ibtn tdel" type="button" data-act="trashtask" data-id="'+t.id+'" title="Buang" aria-label="Buang: '+esc(t.title)+'">'+XI+'</button></div>';
    else if(ctx==='later')actions='<div class="btns"><button class="btn-o btn-g" type="button" data-act="totoday" data-id="'+t.id+'">Ke Hari Ini</button>'+dateBtn(t,'sched','Jadwalkan')+'<button class="btn-o" type="button" data-act="triage" data-to="trash" data-id="'+t.id+'">Buang</button></div>';
    else if(ctx==='dash'&&!done)actions='<div class="btns">'+(t.status==='today'?'':'<button class="btn-o btn-g" type="button" data-act="totoday" data-id="'+t.id+'">Ke Hari Ini</button>')+'<button class="btn-o" type="button" data-act="start" data-id="'+t.id+'">Mulai</button></div>';
  }
  return '<div class="task'+(done?' done':'')+'" id="task-'+t.id+'">'+chk+body+actions+((open&&!editing)?'<div class="rowpane">'+stepsPane(t,'row')+'</div>':'')+'</div>';
}

/* ---------- Layar ---------- */
function inF(t,f){
  if(f==='all')return true;
  var p=t.projectId?projById(t.projectId):null; if(p&&p.archived)p=null;
  if(f==='none')return !p;
  return !!p&&p.areaId===f;
}
function inFilter(t){return inF(t,ui.todayFilter);}
function filterChips(f,act){
  var areas=S.areas.filter(function(a){return !a.archived;}); if(!areas.length)return '';
  function chip(key,label){return '<button type="button" class="fchip" data-act="'+act+'" data-key="'+key+'" aria-pressed="'+(f===key?'true':'false')+'">'+esc(label)+'</button>';}
  var h='<div class="filters" role="group" aria-label="Filter kerjaan">'+chip('all','Semua')+areas.map(function(a){return chip(a.id,a.name);}).join('');
  var hasNone=S.tasks.some(function(t){if(t.status==='trash')return false;var p=t.projectId?projById(t.projectId):null;return !p||p.archived;});

function groupedBlocks(f,rel,ctxOf,order,emptyMsg){
  var groups=[];
  if(f==='none')groups.push({name:'Tanpa projek',tasks:S.tasks.filter(function(t){return rel(t)&&noteOK(t)&&inF(t,f);})});
  else S.projects.filter(function(p){return p.areaId===f&&!p.archived;}).forEach(function(p){groups.push({name:p.name,tasks:S.tasks.filter(function(t){return t.projectId===p.id&&rel(t)&&noteOK(t);})});});
  if(!groups.length)return '<div class="empty">Kerjaan ini belum punya projek. Tambahkan lewat Projek.</div>';
  var gh=groups.map(function(g){
    g.tasks.sort(order);
    return '<div class="grp"><div class="ghead"><b>'+esc(g.name)+'</b><span class="small">'+g.tasks.length+' tugas</span></div>'+
      (g.tasks.length?'<div class="list">'+g.tasks.map(function(t){return taskRow(t,ctxOf(t));}).join('')+'</div>':'<div class="small">'+emptyMsg+'</div>')+'</div>';
  }).join('');
  return W()?'<div class="gcols">'+gh+'</div>':gh;
}
function filteredBlocks(){

  function order(a,b){var x=rk(a),y=rk(b);return x!==y?x-y:byCreated(a,b);}
  return groupedBlocks(ui.todayFilter,rel,function(t){return (t.status==='today'||t.status==='done')?'today':'dash';},order,'Belum ada tugas.');
}

function boardHTML(f){
  var d=new Date().toDateString();
  function relToday(t){return noteOK(t)&&(t.status==='today'||(t.status==='done'&&t.doneAt&&dayOf(t.doneAt)===d));}
  function isLater(t){return noteOK(t)&&(t.status==='later'||t.status==='inbox');}
  var cols=[];
  var projs=S.projects.filter(function(p){var a=areaById(p.areaId);return !p.archived&&a&&!a.archived;});
  projs.sort(function(a,b){
    var ia=S.areas.indexOf(areaById(a.areaId)), ib=S.areas.indexOf(areaById(b.areaId));
    return ia!==ib?ia-ib:S.projects.indexOf(a)-S.projects.indexOf(b);
  });
  if(f!=='none')projs.forEach(function(p){
    if(f!=='all'&&p.areaId!==f)return;
    var today=S.tasks.filter(function(t){return t.projectId===p.id&&relToday(t);});
    var later=S.tasks.filter(function(t){return t.projectId===p.id&&isLater(t);});
    if(f==='all'&&!today.length)return;
    cols.push({key:p.id,area:areaById(p.areaId).name,name:p.name,today:today,later:later});
  });
  if(f==='all'||f==='none'){
    var noP=function(t){var p=t.projectId?projById(t.projectId):null;return !p||p.archived;};
    var nt=S.tasks.filter(function(t){return noP(t)&&relToday(t);}), nl=S.tasks.filter(function(t){return noP(t)&&isLater(t);});
    if(nt.length||(f==='none'&&nl.length))cols.push({key:'none',area:'',name:'Tanpa projek',today:nt,later:nl});
  }
  if(!cols.length)return f==='all'
    ?'<div class="empty">Belum ada tugas di Hari Ini.<br>Ketik sesuatu di kolom atas, lalu pilih <b>Hari ini</b>. Atau buka <b>Minggu</b> untuk mengatur kapan tugas-tugasmu muncul.</div>'
    :'<div class="empty">Kerjaan ini belum punya projek. Tambahkan lewat Projek.</div>';
  return '<div class="board">'+cols.map(colHTML).join('')+'</div>';
}

function doneBuckets(l){
  var t0=new Date();t0.setHours(0,0,0,0); var T=t0.getTime(), D=864e5;
  var b=[['Hari ini',[]],['Kemarin',[]],['7 hari terakhir',[]],['Lebih lama',[]]];
  l.forEach(function(t){var x=new Date(t.doneAt).getTime(); b[x>=T?0:(x>=T-D?1:(x>=T-7*D?2:3))][1].push(t);});
  return b.filter(function(x){return x[1].length;});
}

function clockInfo(f){
  f=f||F(); if(!f)return null;
  var el=Math.floor((Date.now()-f.start)/1000);
  if(f.timerMin){var total=f.timerMin*60,left=Math.max(0,total-el);return {text:fmt(left),label:left>0?'tersisa':'waktu habis',frac:Math.max(left/total,0.004),over:left===0};}
  return {text:fmt(el),label:'sudah berjalan',frac:0.004,over:false};
}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

function ringStart(id){RING[id]={n:0,next:0};}

function sessCleanup(){
  var ch=false;
  Object.keys(S.sess).forEach(function(id){
    var s=S.sess[id]; if(!s||s.end)return; var t=byId(id);
    if(!t||t.status==='done'||t.status==='trash'){S.sess[id]={id:id,end:true,start:s.start,upd:now()};ch=true;}
  });
  if(ch){save();sessSync();}
  var live=sessList(), map={};
  swState();
  live.forEach(function(s){map[s.id]=1; if(NS[s.id]!==alKey(s)&&!(clockInfo(s).over&&isAlerted(s)))notifySession(s,Date.now()-s.start>60000);});
  Object.keys(NS).forEach(function(id){if(!map[id]){notifyClear('langkah-sess-'+id);notifyClear('langkah-over-'+id);delete NS[id];}});
}
function sessAction(a,id){
  var s=S.sess[id], t=byId(id);
  if(!s||s.end||!t){toast('Sesi itu sudah berakhir.');render();return;}
  if(a==='end'){endFocus(id);toast('Sesi diakhiri.');}
  else if(a==='plus5'){setTimer(s,5);toast('Timer 5 menit lagi.');}
  else if(a==='done'){
    if(pendingSteps(t)>0){toast('Masih ada langkah yang belum selesai.');ui.cur=id;ui.view='focus';if(!clockInfo(s).over)notifySession(s,true);}
    else{setStatus(t,'done');save();endFocus(id);toast('Tugas beres. Kamu hebat.');}
  }else{ui.cur=id;ui.view='focus';if(!clockInfo(s).over)notifySession(s,true);}
  render();
}

function act(a,d){

    case 'notenew': ui.modal={type:'note',id:null,proj:d.key||'',nonce:Date.now()}; break;
    case 'projnew': ui.modal={type:'proj',nonce:Date.now(),sel:(ui.filter&&ui.filter!=='today'&&ui.filter!=='all'&&ui.filter!=='none'&&projById(ui.filter))?'p:'+ui.filter:''}; break;
    case 'modalclose': modalClose(); break;

    case 'modaldel': var md=ui.modal&&noteById(ui.modal.id); if(md){ui.modal=null;PM='';delNote(md);} break;
    case 'projcreate': projCreate(); return;
    case 'projarch': var pa=projById(d.id); if(pa){ui.filter='today';delProj(pa);} break;
    case 'nav':
      if(d.view!==ui.view){if(d.view==='today')ui.stack=[]; else ui.stack.push(ui.view); try{history.pushState({v:d.view},'');}catch(x){}}
      ui.view=d.view; ui.edit=null; ui.ntask=null; ui.trashConfirm=false; if(d.view==='search')ui.refocus='gsearch'; break;

    case 'rarea': restoreArea(d.id); save(); toast('Kerjaan dipulihkan beserta projeknya.'); break;
