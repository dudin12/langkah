<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langkah</title>
<meta name="theme-color" content="#2B6B61">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --line:#E4E0D6; --text:#23211E; --muted:#5C574E;
  --accent:#2B6B61; --accent-d:#1F4F47; --tint:#DDEBE6; --side:#EDEAE2; --ctl:#857E70;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:flex;min-height:100vh}
.side{flex:0 0 240px;background:var(--side);padding:28px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:600;font-size:20px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;color:#4A453D;font-size:15px;text-align:left}
.nav button[aria-current="page"]{background:#fff;color:var(--accent-d);font-weight:600}
.nav .count{margin-left:auto;font-size:13px;color:var(--muted)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.side-foot button{min-height:40px;border-radius:10px;border:1.5px solid #B9B2A3;background:transparent;font-size:13px;color:#3A362F}
.main{flex:1 1 560px;min-width:0;padding:48px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.date{font-size:14px;color:var(--muted)}
h1{font-size:38px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:8px 0 0;font-size:16px;line-height:1.5;color:var(--muted)}
.field label{display:block;font-size:14px;font-weight:600;color:#3A362F;margin-bottom:8px}
.input{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 18px;background:#fff;border:1.5px solid var(--ctl);border-radius:16px}
.input input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px}
.input:focus-within{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.psel{height:40px;max-width:190px;border:1.5px solid #B9B2A3;border-radius:10px;background:#fff;padding:0 8px;font-size:14px;color:#3A362F}
.psel.wide{max-width:none;width:100%;height:44px}
.hint{font-size:13px;color:var(--muted);white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.triage{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-radius:16px}
.triage .t{flex:1 1 240px;display:flex;flex-direction:column;gap:2px}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600;text-decoration:none}
.btn:hover{background:var(--accent-d)}
.btn-o{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ctl);background:#fff;color:#3A362F;font-size:14px;font-weight:500}
.btn-o.on{background:var(--tint);border-color:var(--accent);color:var(--accent-d);font-weight:600}
.btn-g{border:1.5px solid var(--accent);color:var(--accent-d);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 24px;background:var(--tint);border-radius:18px}
.suggest .t{flex:1 1 260px}
.suggest b{display:block;font-size:17px;line-height:1.35;color:#14312C}
.suggest span{font-size:13px;font-weight:600;color:var(--accent-d)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sec-head h2{font-size:20px}
.segs{display:flex;gap:4px;align-items:center}
.segs i{width:28px;height:8px;border-radius:4px;background:#D9D4C7;display:block}
.segs i.on{background:var(--accent)}
.list{display:flex;flex-direction:column;gap:12px}
.task{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;background:#fff;border:1px solid var(--line);border-radius:18px;flex-wrap:wrap}
.task .body{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .title{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.task.done .title{font-weight:500;color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plabel{font-size:12px;color:#4A453D;background:#EDEAE2;padding:3px 10px;border-radius:999px}
.chk{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ctl);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{display:none}.chk.on svg{display:block;animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent-d);padding:4px 10px;background:var(--tint);border-radius:999px;border:0}
.chip svg{transition:transform .2s}
.chip[aria-expanded="true"] svg{transform:rotate(90deg)}
.ibtn{flex:0 0 44px;width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.ibtn:hover{background:rgba(0,0,0,.07)}
.editf{display:flex;flex-direction:column;gap:8px}
.rowpane{flex:0 0 100%;width:100%;padding:0 0 4px 0}
.rowpane .pane{max-width:none;border:0;background:var(--bg)}
.later-note{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1.5px dashed #B9B2A3;border-radius:18px;color:#4A453D;font-size:15px;background:transparent;width:100%;text-align:left}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed #B9B2A3;border-radius:18px;line-height:1.5}
.soft{padding:12px 16px;border-radius:14px;background:#F6E3BE;color:#5A3B00;font-size:14px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;background:none;border:0;padding:0;font-size:15px;font-weight:500;color:var(--accent)}
/* dasbor */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:34px;line-height:1.1;font-weight:600}
.stat span{font-size:14px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:#E4E0D6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.area{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.ahead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ahead h2{font-size:20px;flex:1 1 160px;overflow-wrap:anywhere}
.prow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.pt{flex:1 1 180px;display:flex;align-items:center;gap:8px;min-height:44px;border:0;background:transparent;font-size:16px;font-weight:600;text-align:left;padding:0}
.pt svg{transition:transform .2s;flex:0 0 auto}
.pt[aria-expanded="true"] svg{transform:rotate(90deg)}
.pbody{display:flex;flex-direction:column;gap:10px;padding:4px 0 6px}
.addrow{display:flex;gap:8px}
.addrow .sin{flex:1}
/* panel langkah */
.pane{width:100%;max-width:520px;text-align:left;border-radius:18px;background:#fff;border:1px solid var(--line)}
.pane-toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 18px;border:0;background:transparent;font-size:15px;font-weight:600;border-radius:18px;text-align:left;color:inherit}
.pane-toggle svg{transition:transform .2s;flex:0 0 auto}
.pane-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.pane-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.rowpane .pane-body{padding-top:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.srow{display:flex;align-items:center;gap:4px;padding:4px 2px 4px 6px;min-height:52px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.rowpane .srow{background:#fff}
.srow.cur{background:var(--tint);border-color:#B7D3CA}
.srow.over{outline:2px dashed var(--accent)}
.srow.dragging{opacity:.45}
.srow .sc{flex:0 0 40px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ctl);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.srow .sc.on{background:var(--accent);border-color:var(--accent)}
.srow .sc svg{display:none}.srow .sc.on svg{display:block}
.srow .tx{flex:1;min-width:0;font-size:15px;line-height:1.4;overflow-wrap:anywhere;padding:0 6px}
.srow.done .tx{color:var(--muted);text-decoration:line-through}
.srow.edit{flex-wrap:wrap;gap:8px;padding:8px}
.srow.edit .sin{flex:1 1 180px}
.sbtn{flex:0 0 34px;width:34px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0}
.sbtn:hover:not([disabled]){background:rgba(0,0,0,.07)}
.sbtn[disabled]{opacity:.25;cursor:default}
.sin{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1.5px solid var(--ctl);border-radius:12px;background:#fff}
.sin input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:15px}
.sin:focus-within{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
/* fokus */
.focus{min-height:100vh;background:#1E2926;color:#F2F0EA;padding:28px 40px 40px;display:flex;flex-direction:column}
.focus .back{color:#8FD1BF}
.ftop{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.fbtn{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid #5B6F68;background:transparent;color:#E4EBE8;font-size:14px;font-weight:500}
.fbtn[aria-pressed="true"]{border-color:#8FD1BF;background:#34443F;color:#fff;font-weight:600}
.fgrid{flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;padding-top:12px}
.fleft{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:16px 0 4px;width:100%}
.fright{display:flex;flex-direction:column;gap:16px;width:100%;max-width:560px;padding-bottom:24px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#8FD1BF}
.focus h1{font-size:38px;max-width:640px}
.ring{position:relative;width:240px;height:240px}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .time{font-size:56px;font-weight:500;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .lbl{font-size:14px;color:#B5C2BD}
.fact{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.fmain{min-width:220px;height:64px;padding:0 32px;border:0;border-radius:18px;background:#8FD1BF;color:#14211E;font-size:20px;font-weight:600}
.fsec{height:64px;padding:0 24px;border-radius:18px;border:1.5px solid #5B6F68;background:transparent;color:#E4EBE8;font-size:16px;font-weight:500}
.fpanel{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:18px;background:#2A3833}
.fpanel label{font-size:14px;font-weight:600;color:#E4EBE8}
.finput{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:#1E2926;border:1.5px solid #6F837C;border-radius:14px}
.finput input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px;color:#F2F0EA}
.finput:focus-within{outline:3px solid rgba(143,209,191,.45);outline-offset:2px}
.fpanel .hint{color:#B5C2BD}
.fnote{margin:0;max-width:460px;font-size:15px;line-height:1.5;color:#B5C2BD}
.focus .pane{background:#2A3833;border-color:#3D4F48;color:#F2F0EA;max-width:none}
.focus .srow{background:#1E2926;border-color:#3D4F48}
.focus .srow.cur{background:#34443F;border-color:#8FD1BF}
.focus .srow .sc{background:#1E2926;border-color:#6F837C}
.focus .srow .sc.on{background:#8FD1BF;border-color:#8FD1BF}
.focus .srow .sc svg{stroke:#14211E}
.focus .srow.done .tx{color:#B5C2BD}
.focus .sbtn{color:#B5C2BD}
.focus .sbtn:hover:not([disabled]){background:rgba(255,255,255,.1)}
.focus .sin{background:#1E2926;border-color:#6F837C}
.focus .sin input{color:#F2F0EA}
.focus .small{color:#B5C2BD}
.focus .btn{background:#8FD1BF;color:#14211E}
.focus .btn-o{background:transparent;color:#E4EBE8;border-color:#5B6F68}
.title-btn{display:block;text-align:left;font-size:17px;font-weight:600;background:transparent;border:0;padding:2px 4px;margin:-2px -4px;border-radius:8px;overflow-wrap:anywhere;cursor:text;color:inherit}
.title-btn:hover,.name-btn:hover,.srow button.tx:hover{background:rgba(0,0,0,.05)}
.task.done .title-btn{font-weight:500;color:var(--muted);text-decoration:line-through}
.tsel{min-height:32px;border:0;border-radius:999px;background:#EDEAE2;color:#4A453D;font-size:12px;padding:0 8px;max-width:100%;text-overflow:ellipsis;cursor:pointer}
.tsel.none{background:transparent;border:1.5px dashed #B9B2A3;color:#5C574E}
.name-btn{flex:1 1 160px;min-height:44px;border:0;background:transparent;text-align:left;font-size:16px;font-weight:600;padding:0 6px;border-radius:8px;overflow-wrap:anywhere;cursor:text;color:inherit}
h2 .name-btn{font-size:20px}
.cv svg{transition:transform .2s}
.cv[aria-expanded="true"] svg{transform:rotate(90deg)}
.srow button.tx{background:transparent;border:0;text-align:left;min-height:44px;color:inherit;cursor:text;font-size:15px;border-radius:8px}
.srow.done button.tx{color:var(--muted);text-decoration:line-through}
.focus .srow.done button.tx{color:#B5C2BD}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #B9B2A3;background:#fff;font-size:14px;color:#3A362F}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.grp{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ghead{display:flex;align-items:baseline;gap:10px;padding:8px 2px 0}
.ghead b{font-size:16px}
.caprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.caprow label{margin:0!important}
.seg{display:inline-flex;border:1.5px solid #B9B2A3;border-radius:999px;overflow:hidden;background:#fff}
.seg button{min-height:36px;padding:0 16px;border:0;background:transparent;font-size:13px;color:#3A362F}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.compose{display:flex;flex-direction:column;gap:10px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px}
.compose .btns{align-items:center}
textarea.nt-area{width:100%;min-height:120px;border:1.5px solid var(--ctl);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.5;resize:vertical;background:#fff;font-family:inherit;color:inherit}
textarea.nt-area:focus{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.note{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.note.pin{border-color:#B7D3CA;background:#FBFDFC}
.nhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.nhead .grow{flex:1}
.nmini{min-height:36px;padding:0 12px;font-size:13px}
.nline{display:flex;align-items:flex-start;gap:8px}
.nline .ntx{flex:1;min-width:0;text-align:left;background:transparent;border:0;font-size:16px;line-height:1.5;padding:6px 6px;border-radius:8px;cursor:text;overflow-wrap:anywhere;color:inherit}
.nline .ntx:hover{background:rgba(0,0,0,.05)}
.nline .tobtn{flex:0 0 auto;min-height:36px;padding:0 12px;font-size:13px}
.nline.conv .ntx{color:var(--muted);text-decoration:line-through}
.nblank{height:8px}
.ntitle{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:transparent;border:0;padding:4px 0;font-size:17px;font-weight:700;color:inherit;min-height:36px;overflow-wrap:anywhere}
.ntitle svg{flex:0 0 auto;transition:transform .15s}
.ntitle[aria-expanded="true"] svg{transform:rotate(90deg)}
.nprev{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;font-size:15px;line-height:1.5;color:var(--muted);cursor:pointer;overflow-wrap:anywhere}
.nbody{white-space:pre-wrap;font-size:16px;line-height:1.6;overflow-wrap:anywhere;user-select:text;padding:6px 2px}
.nbadge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;width:fit-content}
.nbadge.jalan{background:var(--tint);color:var(--accent-d)}
.nbadge.tuntas{background:#E3EFE0;color:#2F5D2B}
.ntasks{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#F7F5EF;border-radius:12px}
.ntrow{display:flex;align-items:center;gap:8px;min-height:36px}
.ntrow button{background:transparent;border:0;text-align:left;font-size:15px;color:inherit;padding:4px 2px;flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.ntrow{flex-wrap:wrap}.ntrow .pj{background:#EDEAE2;color:#4A453D;padding:2px 8px;border-radius:999px}
.ntrow .st{flex:0 0 auto;font-size:12px;color:var(--muted)}
.ntrow.d button{text-decoration:line-through;color:var(--muted)}
.ntrow .dot{flex:0 0 auto;width:14px;height:14px;border-radius:50%;border:2px solid #B9B2A3}
.ntrow.d .dot{background:var(--accent);border-color:var(--accent)}
input.ntitle-in{width:100%;min-height:44px;border:1.5px solid var(--ctl);border-radius:12px;padding:0 14px;font-size:17px;font-weight:600;font-family:inherit;color:inherit;background:#fff}
input.ntitle-in:focus{outline:3px solid rgba(43,107,97,.35);outline-offset:2px}
.chip.nl{background:#F1EBDD;color:#5A4E2E}
.fromsel{margin-bottom:14px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px rgba(43,107,97,.45)}100%{box-shadow:0 0 0 4px rgba(43,107,97,0)}}
.cvbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--tint);border-radius:12px}
.main.wmain{padding:40px 48px}
.wrap.wide{max-width:1760px}
.wrap.wide>header{max-width:760px;width:100%}
.topgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}
.topgrid>div{display:flex;flex-direction:column;gap:20px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start}
.col .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px;align-items:start}
.xrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,600px));gap:16px}
.col{background:#EFECE4;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col .chead{display:flex;flex-direction:column;gap:2px;padding:2px 4px 4px}
.col .chead small{font-size:12px;color:var(--muted)}
.col .chead b{font-size:17px}
.colmore{display:flex;align-items:center;gap:6px;min-height:40px;border:0;background:transparent;color:var(--accent-d);font-weight:600;font-size:14px;padding:0 6px;text-align:left}
.colmore svg{transition:transform .2s}
.colmore[aria-expanded="true"] svg{transform:rotate(90deg)}

<body>
<div id="root"></div>
<div id="toast-slot" role="status" aria-live="polite"></div>
<form id="gform" autocomplete="off" onsubmit="return false"><button type="submit" hidden tabindex="-1" aria-hidden="true"></button></form>
<input type="file" id="importfile" accept="application/json" hidden>

<script>
(function(){
'use strict';

/* ---------- Data ---------- */
var KEY='langkah.v1';
var MIG=false;
var S=load();
var LASTH={};
function hashItem(x){var c={};for(var k in x)if(k!=='updatedAt')c[k]=x[k];return JSON.stringify(c);}
var COLS=['tasks','areas','projects','notes'];
function snapHashes(){LASTH={};COLS.forEach(function(c){S[c].forEach(function(x){LASTH[c+':'+x.id]=hashItem(x);});});}
/* setiap item yang berubah diberi cap waktu, dipakai untuk menggabungkan data antar perangkat */
function stamp(){
  var t=new Date().toISOString();
  COLS.forEach(function(c){S[c].forEach(function(x){
    var k=c+':'+x.id,h=hashItem(x);
    if(LASTH[k]!==h){ if(LASTH[k]!==undefined||!x.updatedAt)x.updatedAt=t; LASTH[k]=h; }
  });});
}
snapHashes();
var PREFKEY='langkah.pref';
var PREF=(function(){try{return JSON.parse(localStorage.getItem(PREFKEY))||{};}catch(e){return {};}})();
function savePref(){try{localStorage.setItem(PREFKEY,JSON.stringify(PREF));}catch(e){}}
function canWide(){return window.innerWidth>=1500;}
function W(){return canWide()&&!PREF.calm;}
function wrapOpen(){return '<div class="wrap'+(W()?' wide':'')+'">';}
var ui={view:'today',cur:null,trailId:null,timerPick:false,overShown:false,exp:{},edit:null,dashOpen:{},dashAll:false,dashF:'open',noteProj:'',todayFilter:'all',doneFilter:'all',laterFilter:'all',capType:'task',noteQ:'',noteDraft:'',noteDraftTitle:'',noteFilter:'all',gq:'',saveErr:false,undo:null,trashConfirm:false,ntask:null,selText:'',fromNote:'',scrollTo:'',convert:null,capProject:'',toast:'',refocus:null};

function load(){
  var r=null; try{r=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!r||!Array.isArray(r.tasks))r={tasks:[]};
  r.areas=Array.isArray(r.areas)?r.areas:[];
  r.projects=Array.isArray(r.projects)?r.projects:[];
  r.notes=Array.isArray(r.notes)?r.notes:[];
  r.sess=(r.sess&&typeof r.sess==='object'&&!Array.isArray(r.sess))?r.sess:{};
  if(r.focus&&r.focus.id&&!r.sess[r.focus.id]){r.sess[r.focus.id]={id:r.focus.id,start:r.focus.start,timerMin:r.focus.timerMin||0,upd:new Date().toISOString()};MIG=true;}
  delete r.focus;
  r.tomb=(r.tomb&&typeof r.tomb==='object'&&!Array.isArray(r.tomb))?r.tomb:{};
  r.tasks.forEach(function(t){ if(!('projectId' in t))t.projectId=null; if(!('noteId' in t))t.noteId=null; if(!Array.isArray(t.steps))t.steps=[]; });
  var nowIso=new Date().toISOString();
  r.tasks.forEach(function(t){
    if(t.status==='today'&&!t.todayAt){t.todayAt=nowIso;MIG=true;}
    if(t.status==='trash'&&!t.trashedAt){t.trashedAt=nowIso;MIG=true;}
  });
  r.areas.forEach(function(a){if(a.archived&&!a.archivedAt){a.archivedAt=nowIso;MIG=true;}});
  r.projects.forEach(function(p){if(p.archived&&!p.archivedAt){p.archivedAt=nowIso;MIG=true;}});
  r.notes.forEach(function(n){
    if(n.deleted&&!n.deletedAt){n.deletedAt=nowIso;MIG=true;}
    if(typeof n.title!=='string')n.title='';
    if(n.conv){Object.keys(n.conv).forEach(function(k){var tk=null;r.tasks.forEach(function(x){if(x.id===n.conv[k])tk=x;});if(tk&&!tk.noteId)tk.noteId=n.id;});}
  });
  return r;
}
function save(){
  stamp();
  try{localStorage.setItem(KEY,JSON.stringify(S)); if(typeof ui!=='undefined'&&ui.saveErr){ui.saveErr=false;}}
  catch(e){ if(typeof ui!=='undefined'&&!ui.saveErr){ui.saveErr=true;toast('Gagal menyimpan ke browser. Segera cadangkan data.');} }
  if(typeof fsQueue==='function')fsQueue();
  if(typeof syQueue==='function')syQueue();
}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function now(){return new Date().toISOString();}
function dayOf(iso){return new Date(iso).toDateString();}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(id){for(var i=0;i<S.tasks.length;i++){if(S.tasks[i].id===id)return S.tasks[i];}return null;}
function areaById(id){for(var i=0;i<S.areas.length;i++){if(S.areas[i].id===id)return S.areas[i];}return null;}
function projById(id){for(var i=0;i<S.projects.length;i++){if(S.projects[i].id===id)return S.projects[i];}return null;}
function touch(t){t.updatedAt=now();}
function addTask(title,status,projectId){
  var t={id:uid(),title:title,status:status,projectId:projectId||null,noteId:null,createdAt:now(),updatedAt:now(),doneAt:null,steps:[]};
  S.tasks.push(t); return t;
}
function noteById(id){for(var i=0;i<S.notes.length;i++){if(S.notes[i].id===id)return S.notes[i];}return null;}
function addNote(text,projectId,title){
  var n={id:uid(),title:title||'',text:text,projectId:projectId||null,pinned:false,deleted:false,createdAt:now(),updatedAt:now()};
  S.notes.push(n); return n;
}
function noteTitle(n){
  if(n.title&&n.title.trim())return n.title.trim();
  var l=n.text.split('\n').filter(function(x){return x.trim();}); return l.length?l[0].trim():'Tanpa judul';
}
function noteBody(n){
  var lines=n.text.split('\n');
  if(!(n.title&&n.title.trim())){var i=0;while(i<lines.length&&!lines[i].trim())i++;lines=lines.slice(i+1);}
  return lines.join('\n').replace(/^\n+/,'').replace(/\s+$/,'');
}
function projShort(t){var p=t.projectId?projById(t.projectId):null;return p&&!p.archived?p.name:'Tanpa projek';}
function noteTasks(n){return S.tasks.filter(function(t){return t.noteId===n.id&&t.status!=='trash';});}
function noteState(n){
  var l=noteTasks(n); if(!l.length)return {k:'plain',n:0,d:0};
  var d=l.filter(function(t){return t.status==='done';}).length;
  return {k:d===l.length?'tuntas':'jalan',n:l.length,d:d};
}
function noteOK(t){return !ui.fromNote||t.noteId===ui.fromNote;}
function noteBadge(st){
  if(st.k==='plain')return '';
  return st.k==='tuntas'?'<span class="nbadge tuntas">\u2713 Tuntas \u00b7 '+st.n+' tugas</span>':'<span class="nbadge jalan">Berjalan \u00b7 '+st.d+' dari '+st.n+' selesai</span>';
}
function noteChip(t){
  var n=t.noteId?noteById(t.noteId):null; if(!n||n.deleted)return '';
  var ti=noteTitle(n); if(ti.length>26)ti=ti.slice(0,25)+'\u2026';
  return '<button class="chip nl" type="button" data-act="opennote" data-id="'+n.id+'" title="Buka catatan asal">Catatan: '+esc(ti)+'</button>';
}
function noteSel(mode){
  var ns=S.notes.filter(function(n){return !n.deleted&&noteTasks(n).some(function(t){return mode==='done'?t.status==='done':(mode==='later'?t.status==='later':t.status==='today');});});
  if(ui.fromNote&&!ns.some(function(n){return n.id===ui.fromNote;}))ui.fromNote='';
  if(!ns.length)return '';
  return '<div class="fromsel"><label class="sr" for="fromnote">Filter dari catatan</label><select id="fromnote" class="psel" data-change="fromnote" style="max-width:320px"><option value="">Dari catatan: semua</option>'+
    ns.map(function(n){return '<option value="'+n.id+'"'+(n.id===ui.fromNote?' selected':'')+'>'+esc(noteTitle(n))+'</option>';}).join('')+'</select></div>';
}
function setStatus(t,st){
  var prev=t.status;
  if(st==='trash'&&prev!=='trash'){t.prevStatus=prev;t.trashedAt=now();}
  if(st==='done'&&prev!=='done')t.doneFrom=prev;
  t.status=st;touch(t);
  if(st==='done')t.doneAt=now();else t.doneAt=null;
  if(st==='today'&&prev!=='today')t.todayAt=now();
}
/* tugas yang dibuka lagi kembali ke tempat asalnya */
function reopenTo(t){return (t.doneFrom==='later'||t.doneFrom==='inbox')?'later':'today';}
function pendingSteps(t){return t.steps.filter(function(x){return !x.done;}).length;}
function findStep(t,sid){for(var i=0;i<t.steps.length;i++){if(t.steps[i].id===sid)return t.steps[i];}return null;}
function curStep(t){for(var i=0;i<t.steps.length;i++){if(!t.steps[i].done)return {step:t.steps[i],index:i};}return null;}
/* status tugas mengikuti langkahnya */
function syncStatus(t){
  if(!t.steps.length)return null;
  if(pendingSteps(t)===0){ if(t.status!=='done'){setStatus(t,'done');return 'done';} }
  else if(t.status==='done'){ setStatus(t,reopenTo(t)); return 'reopened'; }
  return null;
}
function isOpen(k,def){return Object.prototype.hasOwnProperty.call(ui.exp,k)?!!ui.exp[k]:!!def;}
function projLabel(t){
  var p=t.projectId?projById(t.projectId):null; if(!p||p.archived)return '';
  var a=areaById(p.areaId); return (a&&!a.archived?a.name+' › ':'')+p.name;
}
function projOptions(sel){
  var h='<option value="">Tanpa projek</option>';
  S.areas.filter(function(a){return !a.archived;}).forEach(function(a){
    var ps=S.projects.filter(function(p){return p.areaId===a.id&&!p.archived;}); if(!ps.length)return;
    h+='<optgroup label="'+esc(a.name)+'">'+ps.map(function(p){return '<option value="'+p.id+'"'+(p.id===sel?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</optgroup>';
  });
  return h;
}

/* inbox yang dibiarkan sampai hari berikutnya masuk Nanti otomatis */
function autoSweep(){
  var today=new Date().toDateString(), ch=false;
  S.tasks.forEach(function(t){ if(t.status==='inbox'&&dayOf(t.createdAt)!==today){t.status='later';touch(t);ch=true;} });
  if(ch)save();
}

/* ---------- Sampah & urungkan ---------- */
function trashTask(t){
  setStatus(t,'trash'); save();
  var id=t.id; toast('Tugas dibuang.',function(){restoreTask(id);});
}
function restoreTask(id){
  var t=byId(id); if(!t||t.status!=='trash')return;
  var to=t.prevStatus||'later';
  if(to==='trash'||to==='done')to='later';
  if(to==='inbox'&&dayOf(t.createdAt)!==new Date().toDateString())to='later';
  t.status=to; t.trashedAt=null; touch(t);
  if(to==='today')t.todayAt=now();
}
function delNote(n){
  n.deleted=true; n.deletedAt=now(); save();
  var id=n.id; toast('Catatan dihapus.',function(){restoreNote(id);});
}
function restoreNote(id){var n=noteById(id); if(n){n.deleted=false;n.deletedAt=null;}}
function delProj(p){
  p.archived=true; p.archivedAt=now(); delete p.archivedBy; save();
  var id=p.id; toast('Projek dihapus. Tugasnya pindah ke "Belum masuk projek".',function(){restoreProj(id);});
}
function restoreProj(id){
  var p=projById(id); if(!p)return; p.archived=false; p.archivedAt=null; delete p.archivedBy;
  var a=areaById(p.areaId); if(a&&a.archived){a.archived=false;a.archivedAt=null;}
}
function delArea(a){
  a.archived=true; a.archivedAt=now();
  S.projects.forEach(function(p){ if(p.areaId===a.id&&!p.archived){p.archived=true;p.archivedAt=a.archivedAt;p.archivedBy=a.id;} });
  save(); var id=a.id; toast('Kerjaan dihapus. Tugasnya pindah ke "Belum masuk projek".',function(){restoreArea(id);});
}
function restoreArea(id){
  var a=areaById(id); if(!a)return; a.archived=false; a.archivedAt=null;
  S.projects.forEach(function(p){ if(p.archivedBy===a.id){p.archived=false;p.archivedAt=null;delete p.archivedBy;} });
}
/* hapus permanen: cut = ISO batas waktu, null = semua isi sampah */
function purge(cut){
  function old(ts){return cut===null||!!(ts&&ts<cut);}
  var before=JSON.stringify([S.tasks.length,S.notes.length,S.areas.length,S.projects.length]), tn=now();
  function gone(id){S.tomb[id]=tn;}
  S.tasks=S.tasks.filter(function(t){ if(t.status==='trash'&&old(t.trashedAt)){gone(t.id);return false;} return true; });
  S.notes=S.notes.filter(function(n){ if(n.deleted&&old(n.deletedAt)){gone(n.id);return false;} return true; });
  var goneA={}; S.areas=S.areas.filter(function(a){ if(a.archived&&old(a.archivedAt)){goneA[a.id]=1;gone(a.id);return false;} return true; });
  var goneP={}; S.projects=S.projects.filter(function(p){ if(p.archived&&(old(p.archivedAt)||goneA[p.areaId])){goneP[p.id]=1;gone(p.id);return false;} return true; });
  S.tasks.forEach(function(t){ if(t.projectId&&goneP[t.projectId])t.projectId=null; });
  return before!==JSON.stringify([S.tasks.length,S.notes.length,S.areas.length,S.projects.length]);
}
function trashData(){
  return {
    tasks:S.tasks.filter(function(t){return t.status==='trash';}).sort(function(a,b){return (a.trashedAt||'')<(b.trashedAt||'')?1:-1;}),
    notes:S.notes.filter(function(n){return n.deleted;}).sort(function(a,b){return (a.deletedAt||'')<(b.deletedAt||'')?1:-1;}),
    areas:S.areas.filter(function(a){return a.archived;}),
    projs:S.projects.filter(function(p){ if(!p.archived)return false; var a=areaById(p.areaId); return !(a&&a.archived&&p.archivedBy===a.id); })
  };
}
function trashCount(){var d=trashData();return d.tasks.length+d.notes.length+d.areas.length+d.projs.length;}
function ago(iso){
  if(!iso)return '';
  var t0=new Date();t0.setHours(0,0,0,0); var x=new Date(iso);x.setHours(0,0,0,0);
  var days=Math.round((t0-x)/864e5);
  return days<=0?'hari ini':(days===1?'kemarin':days+' hari lalu');
}
/* tugas Hari Ini yang terbawa dari hari sebelumnya */
function staleToday(){var d=new Date().toDateString();return S.tasks.filter(function(t){return t.status==='today'&&t.todayAt&&dayOf(t.todayAt)!==d;}).sort(byCreated);}
function carryBox(){
  var l=staleToday(); if(!l.length)return '';
  var h='<section class="card triage carry" aria-label="Tugas dari hari sebelumnya"><div class="t"><b style="font-size:16px">Dari hari sebelumnya: '+l.length+' tugas belum selesai</b>'+
    '<span class="small">Tidak apa-apa. Mau tetap dikerjakan hari ini, atau simpan dulu di Nanti?</span></div>';
  h+=l.map(function(t){return '<div class="crow"><span>'+esc(t.title)+'</span><button class="btn-o" type="button" data-act="carry" data-to="keep" data-id="'+t.id+'">Tetap</button><button class="btn-o" type="button" data-act="carry" data-to="later" data-id="'+t.id+'">Nanti</button></div>';}).join('');
  h+='<div class="btns"><button class="btn" type="button" data-act="carry" data-to="keep" style="padding:0 14px;font-size:14px">Tetap semua di Hari Ini</button><button class="btn-o" type="button" data-act="carry" data-to="later">Pindah semua ke Nanti</button></div></section>';
  return h;
}

/* ---------- Sinkron GitHub ---------- */
var SY={cfg:null,state:'off',msg:'',last:null,sha:null,timer:null,busy:false,pending:false,etag:null,canon:null,authFail:false};
try{SY.cfg=JSON.parse(localStorage.getItem('langkah.sync'))||null;}catch(e){}
if(SY.cfg&&SY.cfg.repo&&SY.cfg.token)SY.state='idle'; else SY.cfg=null;

function syMerge(L,R){

  var cut=new Date(Date.now()-60*864e5).toISOString(); Object.keys(tomb).forEach(function(k){if(tomb[k]<cut)delete tomb[k];});

    var m={},order=[]; (a||[]).forEach(function(x){m[x.id]=x;order.push(x.id);});

/* hasil: Promise<true|Error> */
function syncNow(reason){
  if(!SY.cfg)return Promise.resolve(false);
  var auto=(reason!=='manual'&&reason!=='connect');
  if(auto&&SY.authFail)return Promise.resolve(false);
  if(auto&&reason!=='change'&&reason!=='start'&&reason!=='sess'&&SY.lastTs&&Date.now()-SY.lastTs<20000)return Promise.resolve(false);
  if(SY.busy){SY.pending=true;return Promise.resolve(false);}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){SY.state='offline';paintSy();return Promise.resolve(false);}
  SY.busy=true; SY.state='busy'; paintSy();
  var attempts=0;
  function once(){
    var clean=SY.canon!==null&&syCanon(syLocal())===SY.canon&&auto&&attempts===0;
    return syGetRemote(clean).then(function(r){
      if(r&&r.notModified)return true;
      var L=syLocal(), M=syMerge(L,r&&r.data);
      var changedLocal=syCanon(M)!==syCanon(L);
      if(changedLocal){
        SY.applying=true;
        S.tasks=M.tasks;S.areas=M.areas;S.projects=M.projects;S.notes=M.notes;S.tomb=M.tomb;S.sess=M.sess;
        snapHashes();
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
        SY.applying=false;
        if(ui.view==='focus'&&!F())ui.view='today';
        softRender();
      }
      if(r&&syCanon(M)===syCanon(r.data)){SY.sha=r.sha;SY.etag=r.etag;SY.canon=syCanon(M);return true;}
      var out={app:'langkah',v:1,savedAt:now(),tasks:M.tasks,areas:M.areas,projects:M.projects,notes:M.notes,tomb:M.tomb,sess:M.sess};
      return syPut(out,r&&r.sha).then(function(sha){SY.sha=sha;SY.etag=null;SY.canon=syCanon(M);return true;});
    }).catch(function(e){
      if(e.conflict&&attempts<3){attempts++;return once();}
      throw e;
    });
  }
  return once().then(function(){
    SY.busy=false; SY.state='idle'; SY.last=new Date(); SY.lastTs=Date.now(); SY.msg=''; SY.authFail=false; PREF.lastBackup=now(); savePref(); paintSy();
    if(SY.pending){SY.pending=false;syQueue();}
    return true;
  },function(e){
    SY.busy=false; SY.pending=false;
    if(e.net){SY.state='offline';}else{SY.state='err';}
    if(e.status===401||e.status===403)SY.authFail=true;
    SY.msg=e.conflict?'Data berubah terus di perangkat lain. Coba lagi sebentar.':e.message; paintSy(); return e;
  });
}
function syConnect(){
  var repo=val('syrepo').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''), token=val('sytoken');

  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){fail('Tulis nama repo seperti dudin12/langkah-data.');return;}
  if(!token){fail('Tempel token GitHub dulu.');return;}
  var prev=SY.cfg; SY.cfg={repo:repo,token:token,path:'data.json'};
  fetch('https://api.github.com/repos/'+repo,{headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},cache:'no-store'}).then(function(r){
    if(r.status===401)throw syErr(401);
    if(r.status===404||r.status===403)throw new Error(r.status===404?'Repo tidak ditemukan, atau token tidak diberi akses ke repo itu.':syErr(403).message);
    if(!r.ok)throw syErr(r.status);

  },function(){throw new Error('Tidak bisa menghubungi GitHub. Cek koneksi internet, atau jaringan kantor mungkin memblokir api.github.com.');}).then(function(j){
    if(j&&j.private===false&&!window.confirm('Repo ini PUBLIK. Semua orang bisa membaca tugas dan catatanmu. Tetap lanjutkan?')){throw new Error('Dibatalkan. Pakai repo privat.');}
    try{localStorage.setItem('langkah.sync',JSON.stringify(SY.cfg));}catch(e){}
    SY.state='idle'; SY.sha=null; return syncNow('connect');
  }).then(function(res){
    if(res===true){toast('Tersambung. Data digabung dengan GitHub.');ui.view='today';render();}

  },function(e){SY.cfg=prev;fail(e.message);});
}

var FS={supported:typeof window.showSaveFilePicker==='function',handle:null,state:'off',name:'',last:null,timer:null};
function idb(fn){try{if(!window.indexedDB)return;var rq=indexedDB.open('langkah-fs',1);rq.onupgradeneeded=function(){rq.result.createObjectStore('h');};rq.onsuccess=function(){fn(rq.result);};}catch(e){}}

function fsInit(){
  if(!FS.supported)return;
  idbGet(function(h){
    if(!h)return; FS.handle=h; FS.name=h.name||'file data';
    var q; try{q=h.queryPermission({mode:'readwrite'});}catch(e){q='prompt';}
    Promise.resolve(q).then(function(pm){FS.state=pm==='granted'?'on':'need'; if(FS.state==='on')fsWrite(); paintBk();},function(){FS.state='need';paintBk();});
  });
}
function fsConnect(){
  if(!FS.supported)return;
  window.showSaveFilePicker({suggestedName:'langkah-data.json',types:[{description:'Data Langkah',accept:{'application/json':['.json']}}]}).then(function(h){
    FS.handle=h; FS.name=h.name; FS.state='on'; idbPut(h); fsWrite(true);
  },function(e){ if(e&&e.name==='AbortError')return; toast('Tidak bisa memakai file itu.'); });
}
function fsResume(){
  if(!FS.handle)return;
  Promise.resolve(FS.handle.requestPermission({mode:'readwrite'})).then(function(pm){
    if(pm==='granted'){FS.state='on';fsWrite(true);} else toast('Izin belum diberikan. Simpan otomatis belum aktif.');
  },function(){toast('Izin belum diberikan.');});
}
function fsOff(){FS.handle=null;FS.state='off';FS.name='';idbPut(null);paintBk();toast('Simpan otomatis dimatikan.');}
function fsQueue(){ if(FS.state!=='on')return; clearTimeout(FS.timer); FS.timer=setTimeout(function(){fsWrite();},800); }
function fsWrite(announce){
  if(!FS.handle||FS.state!=='on')return;
  var data=JSON.stringify(S,null,2);
  Promise.resolve(FS.handle.createWritable()).then(function(w){return Promise.resolve(w.write(data)).then(function(){return w.close();});}).then(function(){
    FS.last=new Date(); PREF.lastBackup=now(); savePref(); paintBk();
    if(announce)toast('Simpan otomatis aktif. Setiap perubahan ikut tersimpan ke '+FS.name+'.');
  },function(){FS.state='err'; paintBk(); toast('Gagal menulis ke file. Simpan otomatis berhenti.');});
}

function stepsPane(t,mode){
  var n=t.steps.length, dn=n-pendingSteps(t);
  var key=mode==='focus'?'f:'+t.id:t.id, def=mode==='focus'?1:0;
  var open=(mode==='trail')?true:isOpen(key,def);

  else if(mode==='trail')head='<div class="pane-toggle" style="cursor:default"><span>'+label+'</span></div>';
  if(!open)return '<div class="pane">'+head+'</div>';
  var cur=curStep(t), curId=cur?cur.step.id:null, iid='si-'+t.id;
  var rows=t.steps.map(function(s,i){
    var a='data-id="'+t.id+'" data-sid="'+s.id+'"';
    var ed=ui.edit&&ui.edit.type==='step'&&ui.edit.sid===s.id;
    if(ed){
      return '<li class="srow edit" data-sid="'+s.id+'" data-tid="'+t.id+'"><div class="sin"><label class="sr" for="edits">Ubah langkah</label><input id="edits" type="text" value="'+esc(s.text)+'" data-enter="savestep" '+a+'></div></li>';
    }
    return '<li class="srow'+(s.done?' done':'')+(s.id===curId?' cur':'')+'" draggable="true" data-sid="'+s.id+'" data-tid="'+t.id+'">'+
      '<button type="button" class="sc'+(s.done?' on':'')+'" data-act="steptoggle" '+a+' aria-label="'+(s.done?'Batalkan selesai: ':'Tandai selesai: ')+esc(s.text)+'">'+CHECK_S+'</button>'+
      '<button type="button" class="tx" data-act="editstep" '+a+' title="Klik untuk mengubah">'+esc(s.text)+'</button>'+
      '<button type="button" class="sbtn" data-act="stepup" '+a+' aria-label="Naikkan langkah"'+(i===0?' disabled':'')+'>'+UP+'</button>'+
      '<button type="button" class="sbtn" data-act="stepdown" '+a+' aria-label="Turunkan langkah"'+(i===n-1?' disabled':'')+'>'+DOWN+'</button>'+
      '<button type="button" class="sbtn" data-act="stepdel" '+a+' aria-label="Hapus langkah">'+XI+'</button></li>';
  }).join('');
  return '<div class="pane">'+head+'<div class="pane-body">'+
    (n?'<ul class="steps">'+rows+'</ul>':'<div class="small">Belum ada langkah. Tulis satu saja kalau sudah terlintas.</div>')+
    '<div class="sin"><label class="sr" for="'+iid+'">Tambah langkah</label><input id="'+iid+'" type="text" autocomplete="off" placeholder="Tambah langkah, lalu Enter" data-enter="stepadd" data-id="'+t.id+'"><button class="addbtn" type="button" data-act="enterbtn" data-key="'+iid+'">Tambah</button></div></div></div>';
}

function taskRow(t,ctx){
  var done=t.status==='done', n=t.steps.length, dn=n-pendingSteps(t);

      '<button class="chip" type="button" data-act="togglesteps" data-key="'+t.id+'" data-def="0" aria-expanded="'+(open?'true':'false')+'">'+CHEV_S+(n?(dn+' dari '+n+' langkah'):'+ langkah')+'</button></div></div>';
    if(ctx==='today'&&!done)actions='<div class="btns"><button class="btn-o btn-g" type="button" data-act="start" data-id="'+t.id+'">'+(isLive(t.id)?'Lanjutkan':'Mulai')+'</button><button class="btn-o" type="button" data-act="postpone" data-id="'+t.id+'">Tunda</button><button class="ibtn tdel" type="button" data-act="trashtask" data-id="'+t.id+'" title="Buang" aria-label="Buang: '+esc(t.title)+'">'+XI+'</button></div>';
    else if(ctx==='later')actions='<div class="btns"><button class="btn-o btn-g" type="button" data-act="totoday" data-id="'+t.id+'">Ke Hari Ini</button><button class="btn-o" type="button" data-act="triage" data-to="trash" data-id="'+t.id+'">Buang</button></div>';
    else if(ctx==='dash'&&!done)actions='<div class="btns">'+(t.status==='today'?'':'<button class="btn-o btn-g" type="button" data-act="totoday" data-id="'+t.id+'">Ke Hari Ini</button>')+'<button class="btn-o" type="button" data-act="start" data-id="'+t.id+'">Mulai</button></div>';
  }
  return '<div class="task'+(done?' done':'')+'" id="task-'+t.id+'">'+chk+body+actions+((open&&!editing)?'<div class="rowpane">'+stepsPane(t,'row')+'</div>':'')+'</div>';

/* ---------- Layar ---------- */
function inF(t,f){
  if(f==='all')return true;
  var p=t.projectId?projById(t.projectId):null; if(p&&p.archived)p=null;
  if(f==='none')return !p;
  return !!p&&p.areaId===f;
}
function inFilter(t){return inF(t,ui.todayFilter);}
function filterChips(f,act){
  var areas=S.areas.filter(function(a){return !a.archived;}); if(!areas.length)return '';
  function chip(key,label){return '<button type="button" class="fchip" data-act="'+act+'" data-key="'+key+'" aria-pressed="'+(f===key?'true':'false')+'">'+esc(label)+'</button>';}
  var h='<div class="filters" role="group" aria-label="Filter kerjaan">'+chip('all','Semua')+areas.map(function(a){return chip(a.id,a.name);}).join('');
  var hasNone=S.tasks.some(function(t){if(t.status==='trash')return false;var p=t.projectId?projById(t.projectId):null;return !p||p.archived;});
  if(hasNone)h+=chip('none','Tanpa projek');
  return h+'</div>';
}
function groupedBlocks(f,rel,ctxOf,order,emptyMsg){
  var groups=[];
  if(f==='none')groups.push({name:'Tanpa projek',tasks:S.tasks.filter(function(t){return rel(t)&&noteOK(t)&&inF(t,f);})});
  else S.projects.filter(function(p){return p.areaId===f&&!p.archived;}).forEach(function(p){groups.push({name:p.name,tasks:S.tasks.filter(function(t){return t.projectId===p.id&&rel(t)&&noteOK(t);})});});
  if(!groups.length)return '<div class="empty">Kerjaan ini belum punya projek. Tambahkan lewat Dasbor.</div>';
  var gh=groups.map(function(g){
    g.tasks.sort(order);
    return '<div class="grp"><div class="ghead"><b>'+esc(g.name)+'</b><span class="small">'+g.tasks.length+' tugas</span></div>'+
      (g.tasks.length?'<div class="list">'+g.tasks.map(function(t){return taskRow(t,ctxOf(t));}).join('')+'</div>':'<div class="small">'+emptyMsg+'</div>')+'</div>';
  }).join('');
  return W()?'<div class="gcols">'+gh+'</div>':gh;
}
function filteredBlocks(){
  var d=new Date().toDateString();
  function rel(t){return isOpenT(t)||(t.status==='done'&&t.doneAt&&dayOf(t.doneAt)===d);}
  function rk(t){return t.status==='today'?0:(t.status==='done'?2:1);}
  function order(a,b){var x=rk(a),y=rk(b);return x!==y?x-y:byCreated(a,b);}
  return groupedBlocks(ui.todayFilter,rel,function(t){return (t.status==='today'||t.status==='done')?'today':'dash';},order,'Belum ada tugas.');
}

function viewToday(){

  return h+'</section></div>';

function colHTML(c){
  function order(a,b){var x=a.status==='done'?1:0,y=b.status==='done'?1:0;return x!==y?x-y:byCreated(a,b);}
  c.today.sort(order);
  var open=isOpen('n:'+c.key,0);
  var h='<section class="col" aria-label="Projek: '+esc(c.name)+'"><div class="chead">'+(c.area?'<small>'+esc(c.area)+'</small>':'')+'<b>'+esc(c.name)+'</b></div>';
  h+=c.today.length?'<div class="list">'+c.today.map(function(t){return taskRow(t,'today');}).join('')+'</div>':'<div class="small" style="padding:0 4px">Belum ada tugas Hari Ini.</div>';
  if(c.later.length){
    h+='<button class="colmore" type="button" data-act="coltoggle" data-key="n:'+c.key+'" aria-expanded="'+(open?'true':'false')+'">'+CHEV_S+'Dari Nanti ('+c.later.length+')</button>';
    if(open)h+='<div class="list">'+c.later.sort(byCreated).map(function(t){return taskRow(t,'dash');}).join('')+'</div>';
  }
  return h+'</section>';
}
function boardHTML(f){
  var d=new Date().toDateString();
  function relToday(t){return noteOK(t)&&(t.status==='today'||(t.status==='done'&&t.doneAt&&dayOf(t.doneAt)===d));}
  function isLater(t){return noteOK(t)&&(t.status==='later'||t.status==='inbox');}
  var cols=[];
  var projs=S.projects.filter(function(p){var a=areaById(p.areaId);return !p.archived&&a&&!a.archived;});
  projs.sort(function(a,b){
    var ia=S.areas.indexOf(areaById(a.areaId)), ib=S.areas.indexOf(areaById(b.areaId));
    return ia!==ib?ia-ib:S.projects.indexOf(a)-S.projects.indexOf(b);
  });
  if(f!=='none')projs.forEach(function(p){
    if(f!=='all'&&p.areaId!==f)return;
    var today=S.tasks.filter(function(t){return t.projectId===p.id&&relToday(t);});
    var later=S.tasks.filter(function(t){return t.projectId===p.id&&isLater(t);});
    if(f==='all'&&!today.length)return;
    cols.push({key:p.id,area:areaById(p.areaId).name,name:p.name,today:today,later:later});
  });
  if(f==='all'||f==='none'){
    var noP=function(t){var p=t.projectId?projById(t.projectId):null;return !p||p.archived;};
    var nt=S.tasks.filter(function(t){return noP(t)&&relToday(t);}), nl=S.tasks.filter(function(t){return noP(t)&&isLater(t);});
    if(nt.length||(f==='none'&&nl.length))cols.push({key:'none',area:'',name:'Tanpa projek',today:nt,later:nl});
  }
  if(!cols.length)return f==='all'
    ?'<div class="empty">Belum ada tugas di Hari Ini.<br>Ketik sesuatu di kolom atas, lalu pilih <b>Hari ini</b>. Atau buka <b>Dasbor</b> untuk memilih dari semua tugasmu.</div>'
    :'<div class="empty">Kerjaan ini belum punya projek. Tambahkan lewat Dasbor.</div>';
  return '<div class="board">'+cols.map(colHTML).join('')+'</div>';
}
function viewTodayWide(){

  if(f!=='all')h+=groupedBlocks(f,function(t){return t.status==='later';},function(){return 'later';},byCreated,'Belum ada tugas di Nanti.');
  else if(!l.length)h+='<div class="empty">'+(ui.fromNote?'Tidak ada tugas dari catatan ini di Nanti.':'Nanti masih kosong.')+'</div>';

function viewDone(){
  var f=ui.doneFilter; if(f!=='all'&&f!=='none'&&!areaById(f)){ui.doneFilter=f='all';}
  var l=doneList().filter(noteOK);
  var h=wrapOpen()+'<header><h1>Selesai</h1><p class="sub">Semua yang sudah kamu beresin. Lihat, itu banyak.</p></header>'+filterChips(f,'dfilter')+noteSel('done');
  if(f!=='all')h+=groupedBlocks(f,function(t){return t.status==='done';},function(){return 'done';},function(a,b){return a.doneAt<b.doneAt?1:-1;},'Belum ada yang selesai.');
  else if(!l.length)h+='<div class="empty">Belum ada yang selesai. Satu langkah kecil pun dihitung.</div>';
  else h+=doneBuckets(l).map(function(b){
    return '<div class="grp"><div class="ghead"><b>'+b[0]+'</b><span class="small">'+b[1].length+' tugas</span></div><div class="'+(W()?'listgrid':'list')+'">'+b[1].map(function(t){return taskRow(t,'done');}).join('')+'</div></div>';
  }).join('');
  return h+'</div>';
}
function doneBuckets(l){
  var t0=new Date();t0.setHours(0,0,0,0); var T=t0.getTime(), D=864e5;
  var b=[['Hari ini',[]],['Kemarin',[]],['7 hari terakhir',[]],['Lebih lama',[]]];
  l.forEach(function(t){var x=new Date(t.doneAt).getTime(); b[x>=T?0:(x>=T-D?1:(x>=T-7*D?2:3))][1].push(t);});
  return b.filter(function(x){return x[1].length;});
}

  var h=wrapOpen()+'<header><h1>Cari</h1><p class="sub">Cari tugas, langkah, dan catatan.</p></header>'+

function noteProjChip(n){
  if(!S.projects.some(function(p){return !p.archived;}))return '';
  var lab=projLabel(n)||'+ projek', w=Math.min(Math.max(lab.length+4,10),38);
  return '<select class="tsel'+(projLabel(n)?'':' none')+'" data-change="noteproj" data-id="'+n.id+'" aria-label="Projek untuk catatan" style="width:'+w+'ch">'+projOptionsFlat(projLabel(n)?n.projectId:null)+'</select>';

function noteMatches(n){
  var st=noteState(n);
  if(ui.noteProj&&!(n.projectId===ui.noteProj||noteTasks(n).some(function(t){return t.projectId===ui.noteProj;})))return false;
  if(ui.noteFilter==='plain'&&st.k!=='plain')return false;
  if(ui.noteFilter==='jalan'&&st.k!=='jalan')return false;
  if(ui.noteFilter==='tuntas'&&st.k!=='tuntas')return false;
  var q=ui.noteQ.trim().toLowerCase(); if(!q)return true;

/* --- Dasbor --- */
function addInput(id,kind,placeholder,idAttr){
  return '<div class="addrow"><div class="sin"><label class="sr" for="'+idAttr+'">'+esc(placeholder)+'</label><input id="'+idAttr+'" type="text" autocomplete="off" placeholder="'+esc(placeholder)+'" data-enter="'+kind+'"'+(id?' data-id="'+id+'"':'')+'><button class="addbtn" type="button" data-act="enterbtn" data-key="'+idAttr+'">Tambah</button></div></div>';
}
function byDoneDesc(a,b){return (a.doneAt||'')<(b.doneAt||'')?1:-1;}
function dashProjShow(c){return ui.dashF==='open'?(c.open>0||c.done===0):(ui.dashF==='done'?(c.done>0&&c.open===0):true);}
function dashShown(ps){return ps.filter(function(p){return dashProjShow(countFor(S.tasks.filter(function(t){return t.projectId===p.id&&t.status!=='trash';})));});}
function dashProjList(ps){
  var shown=dashShown(ps);
  var h=shown.map(projRow).join('');
  if(!shown.length&&ps.length)h+='<div class="small" style="padding:8px 2px">'+(ui.dashF==='done'?'Belum ada projek yang selesai semua di sini.':'Semua projek di sini sudah selesai.')+'</div>';
  return h;
}
function dashPick(tasks){
  var o=tasks.filter(isOpenT).sort(byCreated), d=tasks.filter(function(t){return t.status==='done';}).sort(byDoneDesc);
  return ui.dashF==='done'?d:(ui.dashF==='all'?o.concat(d):o);
}
function groupBody(key,tasks,projectId){
  var c=countFor(tasks), list=dashPick(tasks), f=ui.dashF;
  var h='<div class="pbody">';
  if(list.length)h+='<div class="list">'+list.map(function(t){return taskRow(t,'dash');}).join('')+'</div>';
  else h+='<div class="small">'+(f==='done'?'Belum ada tugas yang selesai.':(f==='all'?'Belum ada tugas.':'Tidak ada tugas yang belum selesai.'))+'</div>';
  if(f==='open'&&c.done)h+='<div class="small">'+c.done+' tugas sudah selesai di sini.</div>';
  if(f==='done'&&c.open)h+='<div class="small">'+c.open+' tugas belum selesai di sini.</div>';
  if(projectId)h+=addInput(projectId,'projtask','Tambah tugas ke projek ini, lalu Enter','pt-'+projectId);
  return h+'</div>';
}
function editBox(type,id,name,label){

    '<div class="btns"><button class="btn" type="button" data-act="saveent" data-id="'+id+'" style="min-height:48px">Simpan</button><button class="btn-o" type="button" data-act="canceledit" style="min-height:48px">Batal</button><button class="btn-o" type="button" data-act="'+(type==='area'?'delarea':'delproj')+'" data-id="'+id+'" style="min-height:48px">Hapus</button></div></div>';

function projRow(p){

function viewDash(){

  if(ui.dashAll){

  var areas=S.areas.filter(function(a){return !a.archived;});

      var cf=F(), ft=cf&&byId(cf.id); if(!ft)break;
      var cs=curStep(ft);
      if(cs){cs.step.done=true;cs.step.doneAt=now();touch(ft);var r1=syncStatus(ft);save();if(r1)afterStep(r1);else toast('Satu langkah beres.');}
      break;
    case 'taskdone':
      var cf2=F(), tt=cf2&&byId(cf2.id); if(!tt)break;
      if(pendingSteps(tt)>0){toast('Masih ada langkah yang belum selesai.');break;}
      setStatus(tt,'done');save();endFocus();toast('Tugas beres. Kamu hebat.'); break;
    case 'steptoggle':
      if(!t)break;
      var st=findStep(t,d.sid); if(!st)break;
      st.done=!st.done; st.doneAt=st.done?now():null; touch(t);
      var r2=syncStatus(t); save();
      if(r2)afterStep(r2); else if(st.done)toast('Satu langkah beres.');
      break;
    case 'stepup': case 'stepdown':
      if(!t)break;
      var idx=-1; t.steps.forEach(function(x,i){if(x.id===d.sid)idx=i;});
      var to=a==='stepup'?idx-1:idx+1;
      if(idx<0||to<0||to>=t.steps.length)break;
      var mv=t.steps.splice(idx,1)[0]; t.steps.splice(to,0,mv); touch(t); save(); break;
    case 'stepdel':
      if(!t)break;
      t.steps=t.steps.filter(function(x){return x.id!==d.sid;}); touch(t);
      var r3=syncStatus(t); save(); afterStep(r3); break;
    /* edit */
    case 'edittask': ui.edit={type:'task',id:d.id}; ui.refocus='editt'; break;
    case 'editstep': ui.edit={type:'step',id:d.id,sid:d.sid}; ui.refocus='edits'; break;
    case 'editarea': ui.edit={type:'area',id:d.id}; ui.refocus='edita'; break;
    case 'editproj': ui.edit={type:'project',id:d.id}; ui.refocus='edita'; break;
    case 'canceledit': ui.edit=null; break;
    case 'savetask': saveTask(d.id,true); break;
    case 'savestep': saveStep(d.id,d.sid,true); break;
    case 'saveent': saveEntity(); break;
    case 'delarea':
      var ar=areaById(d.id); if(ar){ui.edit=null;delArea(ar);} break;
    case 'delproj':
      var pr=projById(d.id); if(pr){ui.edit=null;delProj(pr);} break;
    case 'postponefocus':
      var cf3=F(), pt=cf3&&byId(cf3.id); if(pt){setStatus(pt,'later');save();}
      endFocus();toast('Dipindah ke Nanti. Tidak apa-apa.'); break;
    case 'enterbtn': var eb=document.getElementById(d.key); if(eb&&eb.value.trim()){triggerEnter(eb);return;} if(eb)eb.focus(); return;
    case 'export': doExport(); return;
    case 'import': document.getElementById('importfile').click(); return;
  }
  render();
}

function saveNewNote(){
  var el=document.getElementById('newnote'); var v=(el?el.value:ui.noteDraft).trim();
  if(!v){ui.refocus='newnote';render();return;}
  var se=document.getElementById('newnoteproj'); var pid=se?(se.value||null):(ui.capProject||null);
  addNote(v,pid,val('newnotetitle')); save(); ui.noteDraft=''; ui.noteDraftTitle=''; ui.refocus='newnote'; toast('Catatan tersimpan.'); render();
}
function saveNote(id,nr){
  var n=noteById(id); ui.edit=null;
  if(n){
    var v=val('editn'), ti=document.getElementById('editnt')?val('editnt'):n.title, ch=false;
    if(v&&v!==n.text){n.text=v;ch=true;}
    if(ti!==(n.title||'')){n.title=ti;ch=true;}
    if(ch){n.updatedAt=now();save();}
  }
  if(!nr)render();
}
function cleanLine(l){return l.trim().replace(/^([-*•]|\[[ xX]?\])\s*/,'').trim();}
function createNoteTask(to){
  var f=ui.ntask; if(!f)return;
  var n=noteById(f.id); if(!n){ui.ntask=null;render();return;}
  var title=val('nttitle').replace(/\s+/g,' ').trim();
  if(!title){ui.refocus='nttitle';render();return;}
  var pid=val('ntproj')||null;
  var t=addTask(title,to==='today'?'today':'later',pid); t.noteId=n.id;
  n.updatedAt=now(); save();
  ui.ntask={id:n.id,title:''}; ui.refocus='nttitle';
  toast(to==='today'?'Jadi tugas di Hari Ini.':'Jadi tugas di Nanti.'); render();
}
function saveTask(id,nr){
  var t=byId(id); ui.edit=null;
  if(t){var v=val('editt'); if(v&&v!==t.title){t.title=v;touch(t);save();}}
  if(!nr)render();
}
function saveStep(id,sid,nr){
  var t=byId(id), s=t&&findStep(t,sid); ui.edit=null;
  if(s){var v=val('edits'); if(v&&v!==s.text){s.text=v;touch(t);save();}}

}
function saveEntity(){
  var e=ui.edit; if(!e)return;
  var v=val('edita'); var o=e.type==='area'?areaById(e.id):projById(e.id);
  if(o&&v){o.name=v;save();}
  ui.edit=null; toast('Tersimpan.'); render();
}

function onEnter(kind,inp,d,forceNote){
  var v=inp.value.trim();
  if(kind==='settimerc'){
    var mm=parseInt(v,10);
    if(!(mm>=1&&mm<=720)){toast('Isi menit antara 1 sampai 720.');render();return;}
    setTimer(F(),mm); notifyAsk(); ui.timerPick=false; render(); return;
  }
  if(kind==='capture'){
    if(!v)return;
    var asNote=!!forceNote||ui.view==='focus'||ui.capType==='note';
    var pid=null;
    if(ui.view==='focus'){var cf4=F(), ft=cf4&&byId(cf4.id); pid=ft?ft.projectId:null;}
    else{var se=document.getElementById('capproj'); pid=se?(se.value||null):(ui.capProject||null);}
    if(asNote){addNote(v,pid);toast('Masuk Catatan.');}else{addTask(v,'inbox',pid);toast('Tertangkap.');}
    save();inp.value='';
    ui.refocus=(ui.view==='focus')?'terlintas':'capture';
    render(); return;
  }
  if(kind==='stepadd'){
    var t=byId(d.id); if(!t||!v)return;
    t.steps.push({id:uid(),text:v,done:false,doneAt:null}); touch(t);
    var r=syncStatus(t); save();
    ui.exp[(ui.view==='focus'?'f:':'')+t.id]=true; ui.refocus='si-'+t.id;
    if(r==='reopened')toast('Tugas dibuka lagi.');
    render(); return;
  }
  if(kind==='ntaskgo'){createNoteTask('later');return;}
  if(kind==='syconnect'){syConnect();return;}
  if(kind==='notetitle'){var ta=document.getElementById('editn');if(ta)ta.focus();return;}
  if(kind==='savetask'){saveTask(d.id);return;}
  if(kind==='savestep'){saveStep(d.id,d.sid);return;}
  if(kind==='saveent'){saveEntity();return;}
  if(kind==='addarea'){
    if(!v)return; S.areas.push({id:uid(),name:v,archived:false}); save(); ui.refocus='newarea'; toast('Kerjaan ditambahkan.'); render(); return;
  }
  if(kind==='addproj'){
    if(!v)return; var np={id:uid(),areaId:d.id,name:v,archived:false}; S.projects.push(np); save(); ui.dashOpen[np.id]=true; ui.refocus='ap-'+d.id; toast('Projek ditambahkan.'); render(); return;
  }
  if(kind==='projtask'){
    if(!v)return; addTask(v,'later',d.id); save(); ui.refocus='pt-'+d.id; toast('Tugas ditambahkan.'); render(); return;
  }
}

function downloadJSON(name){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},500);
}

}

/* seret untuk mengurutkan langkah */
var dragSid=null;
function rowOf(e){return e.target&&e.target.closest?e.target.closest('li[data-sid]'):null;}
document.addEventListener('dragstart',function(e){
  var li=rowOf(e); if(!li)return; dragSid=li.getAttribute('data-sid'); li.classList.add('dragging');
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragSid);}catch(x){}
});
document.addEventListener('dragover',function(e){
  var li=rowOf(e); if(!li||!dragSid)return; e.preventDefault();
  Array.prototype.forEach.call(document.querySelectorAll('.srow.over'),function(n){n.classList.remove('over');});
  if(li.getAttribute('data-sid')!==dragSid)li.classList.add('over');
});
document.addEventListener('dragend',function(){dragSid=null;Array.prototype.forEach.call(document.querySelectorAll('.srow.over,.srow.dragging'),function(n){n.classList.remove('over');n.classList.remove('dragging');});});
document.addEventListener('drop',function(e){
  var li=rowOf(e); if(!li||!dragSid)return; e.preventDefault();
  var t=byId(li.getAttribute('data-tid')); var target=li.getAttribute('data-sid');
  if(t&&target!==dragSid){
    var from=-1,to=-1; t.steps.forEach(function(x,i){if(x.id===dragSid)from=i;if(x.id===target)to=i;});
    if(from>=0&&to>=0){var mv=t.steps.splice(from,1)[0];t.steps.splice(to,0,mv);touch(t);save();}
  }
  dragSid=null; render();
});
document.addEventListener('input',function(e){
  var el=e.target; if(!el||!el.getAttribute)return;
  var k=el.getAttribute('data-input');
  if(k==='newnote')ui.noteDraft=el.value;
  else if(k==='newnotetitle')ui.noteDraftTitle=el.value;

  else if(k==='gsearch'){ui.gq=el.value;ui.refocus='gsearch';render();}
});
/* klik di luar kolom edit = simpan */
document.addEventListener('focusout',function(e){
  var el=e.target; if(!el||!el.getAttribute||!ui.edit)return;
  var k=el.getAttribute('data-enter'), nr=!!e.relatedTarget;
  if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.nedit')&&el.closest&&el.closest('.nedit'))return;
  if(el.getAttribute('data-ctrl')==='savenote'&&ui.edit.type==='note'){saveNote(el.getAttribute('data-id'),nr);return;}
  if(k==='savetask'&&ui.edit.type==='task')saveTask(el.getAttribute('data-id'),nr);
  else if(k==='savestep'&&ui.edit.type==='step')saveStep(el.getAttribute('data-id'),el.getAttribute('data-sid'),nr);
});
function isField(el){if(!el||!el.tagName)return false;var tg=el.tagName;return tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||!!el.isContentEditable;}
function quickCapture(){
  var id=ui.view==='focus'?'terlintas':(document.getElementById('capture')?'capture':(ui.view==='notes'?'newnote':''));
  if(id){var el=document.getElementById(id);if(el){el.focus();return;}}
  ui.view='today'; ui.edit=null; ui.refocus='capture'; render();
}
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!isField(e.target)){e.preventDefault();quickCapture();return;}
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='k'||e.key==='K')){e.preventDefault();ui.view='search';ui.edit=null;ui.refocus='gsearch';render();return;}
  if(e.key==='Escape'&&(ui.edit||ui.ntask)){ui.edit=null;ui.ntask=null;render();return;}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target&&e.target.getAttribute){
    var c=e.target.getAttribute('data-ctrl'), en=e.target.getAttribute('data-enter');
    if(c==='note-new'){e.preventDefault();saveNewNote();return;}
    if(c==='savenote'){e.preventDefault();saveNote(e.target.getAttribute('data-id'));return;}
    if(en==='capture'){e.preventDefault();onEnter('capture',e.target,{},true);return;}
  }
  if(e.key!=='Enter'||e.isComposing)return;
  var el=e.target; if(!el||!el.getAttribute)return;
  if(!el.getAttribute('data-enter'))return;
  e.preventDefault(); triggerEnter(el);
});
function triggerEnter(el){
  var kind=el&&el.getAttribute&&el.getAttribute('data-enter'); if(!kind)return;
  onEnter(kind,el,{id:el.getAttribute('data-id'),sid:el.getAttribute('data-sid')});
}

document.getElementById('importfile').addEventListener('change',function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f)return;
  var r=new FileReader();
  var backedUp=false;
  if(S.tasks.length||S.notes.length){try{backedUp=true;downloadJSON('langkah-sebelum-impor-'+new Date().toISOString().slice(0,10)+'.json');}catch(x){}}
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!j||!Array.isArray(j.tasks))throw new Error('format');
      var oldIds={}; COLS.forEach(function(c){S[c].forEach(function(x){oldIds[x.id]=1;});});
      var tomb=(j.tomb&&typeof j.tomb==='object')?j.tomb:{};
      var newIds={}; [j.tasks,j.areas||[],j.projects||[],j.notes||[]].forEach(function(a){a.forEach(function(x){newIds[x.id]=1;});});
      if(SY.cfg){var tn2=now();Object.keys(oldIds).forEach(function(id){if(!newIds[id])tomb[id]=tn2;});}
      localStorage.setItem(KEY,JSON.stringify({tasks:j.tasks,areas:j.areas||[],projects:j.projects||[],notes:j.notes||[],tomb:tomb,sess:{}}));
      S=load();snapHashes();save();ui.view='today';toast('Data dipulihkan.'+(backedUp?' Data lama sudah diunduh sebagai cadangan.':''));render();
    }catch(err){toast('File itu bukan cadangan Langkah.');render();}
  };
  r.readAsText(f);ev.target.value='';
});
